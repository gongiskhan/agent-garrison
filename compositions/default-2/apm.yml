name: dogfood-operative
version: 0.1.0
target: claude
dependencies:
  apm:
    - path: ../../fittings/seed/agent-sdk-runtime
    - path: ../../fittings/seed/automations
    - path: ../../fittings/seed/basic-memory
    - path: ../../fittings/seed/browser-default
    - path: ../../fittings/seed/claude-code-runtime
    - path: ../../fittings/seed/codex-runtime
    - path: ../../fittings/seed/dev-env
    - path: ../../fittings/seed/drill
    - path: ../../fittings/seed/file-browser
    - path: ../../fittings/seed/garrison-assistant
    - path: ../../fittings/seed/garrison-call
    - path: ../../fittings/seed/gemini-runtime
    - path: ../../fittings/seed/google
    - path: ../../fittings/seed/http-gateway
    - path: ../../fittings/seed/huggingface-runtime
    - path: ../../fittings/seed/improver
    - path: ../../fittings/seed/improver-nightly
    - path: ../../fittings/seed/jarvis-os
    - path: ../../fittings/seed/kanban-loop
    - path: ../../fittings/seed/local-voice
    - path: ../../fittings/seed/loop-heartbeat
    - path: ../../fittings/seed/mcp-gateway
    - path: ../../fittings/seed/monitor-default
    - path: ../../fittings/seed/morning-briefing
    - path: ../../fittings/seed/omi-channel
    - path: ../../fittings/seed/opencode-runtime
    - path: ../../fittings/seed/openrouter-runtime
    - path: ../../fittings/seed/orchestrator
    - path: ../../fittings/seed/ports-default
    - path: ../../fittings/seed/project-viewer
    - path: ../../fittings/seed/power-default
    - path: ../../fittings/seed/scheduler
    - path: ../../fittings/seed/screen-share-default
    - path: ../../fittings/seed/slack-channel
    - path: ../../fittings/seed/snapshots-default
    - path: ../../fittings/seed/taste
    - path: ../../fittings/seed/trello
    - path: ../../fittings/seed/web-channel-default
    - path: ../../fittings/seed/whatsapp-web
x-garrison:
  composition:
    schema: 4
    id: default-2
    name: Dogfood Operative
    global_config:
      projects_root: ~/dev
      vault: default
      platform: claude-code
      guardrails:
        max_tasks_per_tick: 10
        max_spend_per_day: 250
        max_tool_calls_per_tick: 300
      permissions_mode: auto
      observability_config:
        log_sink: runner
    selections:
      orchestrator:
        - id: orchestrator
          config:
            bind_host: 127.0.0.1
      channels:
        - id: slack-channel
          config:
            slack_port: 9512
            gateway_url: http://127.0.0.1:4777
            chat_timeout_ms: 600000
        - id: web-channel-default
          config:
            bind_host: 127.0.0.1
            gateway_url: ''
        - id: omi-channel
          config:
            bind_host: 127.0.0.1
            public_base_url: https://dev-madrid.tail31efa.ts.net:8443
            enabled: true
        - id: whatsapp-web
          config:
            bind_host: 127.0.0.1
            session_dir: ~/.config/garrison/whatsapp-web
            min_send_delay_ms: 1200
            max_send_delay_ms: 3500
        - id: jarvis-os
          config:
            port: 8082
            bind_host: 127.0.0.1
            gateway_url: ''
            vad_redemption_ms: 550
            endpoint_min_ms: 350
            endpoint_max_ms: 2600
            bargein_confirm_ms: 350
            bargein_prob: 0.55
            wake_idle_timeout_s: 90
        - id: local-voice
          config:
            port: 8100
            bind_host: 127.0.0.1
            kokoro_voice: bm_george
            pause_comma: 0.08
            pause_clause: 0.15
            pause_sentence: 0.22
            pause_question: 0.27
            pause_ellipsis: 0.34
            pause_para: 0.42
            min_clause: 26
            whisper_model: large-v3
            whisper_lang: pt
            tts_force_lang: pt
            stt_engine: whisper-cpp
            whisper_cpp_model: ~/.cache/whisper-cpp/ggml-WhisperLv3-FT-EP-q5_0.bin
            whisper_cpp_no_timestamps: true
            stt_normalize_gain: 'on'
            wake_word: 'on'
            wake_threshold: 0.5
            whisper_beam: 2
      gateway:
        - id: http-gateway
          config:
            bind_host: 127.0.0.1
            compact_enabled: true
            compact_threshold_pct: 60
        - id: mcp-gateway
          config: {}
      runtimes:
        - id: claude-code-runtime
          config:
            account: auto
        - id: garrison-call
          config: {}
        - id: codex-runtime
          config: {}
        - id: gemini-runtime
          config: {}
        - id: opencode-runtime
          config: {}
        - id: agent-sdk-runtime
          config:
            provider: anthropic
            model: ''
            promptMode: coding
            maxTurns: 500
            account: ''
        - id: openrouter-runtime
          config:
            model: anthropic/claude-sonnet-5
            account: ''
        - id: huggingface-runtime
          config:
            model: deepseek-ai/DeepSeek-V4-Pro
            account: ''
      memory:
        - id: basic-memory
          config:
            vault_dir: ~/ObsidianVault
            memory_dir: Memory
            project_name: main
            capture_enabled: true
            # OFF on this node, deliberately. With it on, the consumer at
            # ~/.claude/basic-memory/consume-kanban-completions.mjs goes missing
            # between setup and verify on every up() here — setup's if-branch
            # runs (the state file reads `enabled`) and the file is present after
            # any setup run by hand, yet verify still reports it absent, so up()
            # aborts and no gateway ever starts. Root cause not found.
            #
            # setup records the effective switch, and verify honours `disabled`
            # rather than the manifest default, so turning it off is consistent
            # rather than a bypass. What is given up: Done cards with
            # scope=personal no longer become Personal/Kanban Completions notes
            # in the vault. Flip back to true once the disappearance is
            # explained.
            kanban_completion_capture_enabled: false
            register_codex_gemini: false
      observability:
        - id: monitor-default
          config:
            bind_host: 127.0.0.1
            poll_interval_ms: 1000
            log_retention_hours: 24
        - id: automations
          config:
            bind_host: 127.0.0.1
        - id: improver
          config:
            bind_host: 127.0.0.1
            cron: 30 3 * * *
            vault_dir: ~/ObsidianVault
            memory_primary: true
            checkpoint_retention_days: 14
            dream_model: haiku
        - id: scheduler
          config:
            jobs_file: ~/.garrison/scheduler-jobs.json
            log_file: ~/.garrison/scheduler.log
            health_port: 8099
        - id: kanban-loop
          config:
            bind_host: 127.0.0.1
            board_dir: ~/.garrison/kanban-loop
            iteration_cap: 10
            test_beat_cron: 0 */5 * * *
            tick_cron: '*/2 * * * *'
            review_cron: 0 8 * * 1
            review_stall_hours: 2
            outpost_host_url: http://127.0.0.1:3702
        - id: loop-heartbeat
          config:
            cadence_minutes: 40
            gateway_url: http://127.0.0.1:4777/jobs
      sessions:
        - id: garrison-assistant
          config:
            bind_host: 127.0.0.1
        - id: dev-env
          config:
            bind_host: 127.0.0.1
        - id: file-browser
          config:
            bind_host: 127.0.0.1
            root: ~/.garrison/files
        - id: snapshots-default
          config:
            projects_root: ~/dev
        - id: improver-nightly
          config:
            autonomy_mode: manual
            schedule_cron: 17 3 * * *
            state_dir: data/improver
            proposal_namespace: improver
            require_unlocked_vault: true
        - id: morning-briefing
          config:
            briefing_time: '08:00'
            weekdays_only: true
      surfaces:
        - id: screen-share-default
          config:
            bind_host: 127.0.0.1
        - id: browser-default
          config:
            bind_host: 127.0.0.1
            viewport_width: 1600
            viewport_height: 1200
            jpeg_quality: 70
            every_nth_frame: 1
        - id: ports-default
          config:
            bind_host: 127.0.0.1
            scan_interval_ms: 5000
        - id: power-default
          config:
            bind_host: 127.0.0.1
            idle_minutes: 30
            load_threshold: 1
      knowledge:
        - id: project-viewer
          config:
            port: 8078
            bind_host: 127.0.0.1
            target_repo: ~/dev/agent-garrison-dev
            language: pt
      building:
        - id: drill
          config:
            bind_host: 127.0.0.1
      design:
        - id: taste
          config: {}
      connectors:
        - id: trello
          config:
            board_id: vl1Z8KFH
        - id: google
          config: {}
    prompt_sources:
      orchestrator: .garrison/prompts/orchestrator.md
    duties:
      - id: code
        title: Code
        description: 'Write or change code: features, fixes, refactors.'
        levels:
          - description: 'trivial: a rename, a typo, a one-line fix, a mechanical edit confined to one spot'
            cell:
              target: cc-sonnet
              effort: high
          - description: 'standard: a bounded feature, a localized bug fix, a focused refactor in one area'
            cell:
              target: cc-sonnet
              effort: xhigh
          - description: >-
              deep: architecture, cross-cutting refactors, tricky bugs with unclear cause,
              security-sensitive or multi-subsystem work
            cell:
              target: cc-opus
              effort: max
      - id: other
        title: Other
        description: Anything that fits no other duty.
        levels:
          - description: 'quick: a direct answer, a lookup, a small ask that needs no real work'
            cell:
              target: cc-sonnet
              effort: medium
          - description: 'involved: unclassified work that still needs real thought or multiple steps'
            cell:
              target: cc-opus
              effort: high
      - id: research
        title: Research
        description: 'Find things out: look up, survey, investigate.'
        levels:
          - description: 'lookup: a fact check or a single-source answer'
            cell:
              target: cc-sonnet
              effort: high
          - description: 'focused: survey a topic or compare a few options, with sources'
            cell:
              target: cc-opus
              effort: high
          - description: 'deep-dive: a thorough multi-source investigation with synthesis and citations'
            cell:
              target: cc-opus
              effort: max
      - id: discuss
        title: Discuss
        description: Talk a problem through and write a brief when the thinking settles.
        levels:
          - description: >-
              level 1: quick discussion - talk a focused question or tradeoff through in prose, then
              write the brief when the thinking settles.
            cell:
              target: fable
              effort: medium
          - description: 'level 2: deeper than level 1 - describe when the Dispatcher should pick this level'
            cell:
              target: fable
              effort: high
          - description: 'level 3: deeper than level 2 - describe when the Dispatcher should pick this level'
            cell:
              target: fable
              effort: xhigh
      - id: plan
        title: Plan
        description: Design an implementation plan before building.
        levels:
          - description: 'design the implementation plan for the work at hand: explore, decide, write the plan'
            cell:
              target: fable
              effort: high
          - description: 'level 2: deeper than level 1 - describe when the Dispatcher should pick this level'
            cell:
              target: fable
              effort: xhigh
          - description: 'level 3: deeper than level 2 - describe when the Dispatcher should pick this level'
            cell:
              target: fable
              effort: max
      - id: implement
        title: Implement
        description: Execute a planned change end to end.
        context_hold: true
        levels:
          - description: 'carry a planned change end to end: code, verify, evidence'
            cell:
              target: opus
              effort: xhigh
      - id: review
        title: Review
        description: Review a change for correctness and quality.
        levels:
          - description: 'light: sanity-pass a small, low-risk diff'
            cell:
              target: cc-sonnet
              effort: low
          - description: 'standard: review a focused diff for correctness and style'
            cell:
              target: cc-sonnet
              effort: medium
          - description: 'deep: review a large or risky change; hunt for real defects, not nits'
            cell:
              target: cc-opus
              effort: high
      - id: test
        title: Test
        description: Exercise a change with tests.
        levels:
          - description: 'smoke: run the existing suite and confirm it stays green'
            cell:
              target: cc-sonnet
              effort: low
          - description: 'standard: run and extend the tests that cover the change'
            cell:
              target: cc-opus
              effort: high
          - description: 'thorough: build out missing coverage, e2e included'
            cell:
              target: cc-opus
              effort: xhigh
      - id: image
        title: Image
        description: Create or edit images.
        levels:
          - description: generate or edit an image
            cell:
              target: sec-gemini
      - id: video
        title: Video
        description: Create or edit videos.
        levels:
          - description: generate or edit a video
            cell:
              target: sec-gemini
      - id: writing
        title: Writing
        description: 'Write prose: notes, docs, posts, specs.'
        levels:
          - description: 'short-form: a note, a summary, an announcement, a doc tweak'
            cell:
              target: cc-sonnet
              effort: medium
          - description: 'long-form: a document, a spec, a post with structure and polish'
            cell:
              target: cc-sonnet
              effort: high
      - id: ops
        title: Ops
        description: 'Operate the system: run, restart, configure, deploy.'
        levels:
          - description: 'routine: restart a service, check a status, run a known command'
            cell:
              target: cc-sonnet
              effort: high
          - description: 'careful: config changes, migrations, anything with blast radius'
            cell:
              target: cc-opus
              effort: high
          - description: 'level 3: deeper than level 2 - describe when the Dispatcher should pick this level'
            cell:
              target: cc-opus
              effort: xhigh
      - id: drill
        title: Drill
        description: >-
          Plan-driven, page-level QA: author or update the Drill Book for changed pages, gate for
          approval (configurable), then run the plan (vision or graduated e2e) per selected viewport
          and report findings. One duty, two internal stages (plan, then run) with a gate between
          (R7). Replaces the Walkthrough evidence job and the separate Validate phase (D8); absorbs
          Adversarial Test as a second, blind, vision-forced run (R12).
        gate: explicit
        levels:
          - description: >-
              standard drill pass: plan/update the plan for changed pages, gate for approval, then
              run and report findings.
            cell:
              target: cc-opus
              effort: high
          - description: >-
              deep: the same stages at maximum reasoning, for an unfamiliar or large surface, or a
              page whose checks keep coming back ambiguous.
            cell:
              target: cc-opus
              effort: max
          - description: >-
              frontier: the hardest surfaces, where even a maximum-effort pass cannot settle what
              the page is supposed to prove.
            cell:
              target: fable
              effort: max
      - id: adversarial-review
        title: Adversarial Review
        description: Independent cross-model review that tries to refute the change.
        levels:
          - description: 'standard: an independent cross-model pass over the change'
            cell:
              target: sol
              effort: medium
          - description: 'deep: decorrelated scrutiny of a risky or security-adjacent change'
            cell:
              target: sol
              effort: xhigh
          - description: 'level 3: deeper than level 2 - describe when the Dispatcher should pick this level'
            cell:
              target: sol
              effort: max
      - id: adversarial-test
        title: Adversarial Test
        description: Independent cross-model attempt to break the change.
        levels:
          - description: 'standard: an independent attempt to break the change'
            cell:
              target: sol
              effort: medium
          - description: 'deep: sustained adversarial testing of a critical path'
            cell:
              target: sol
              effort: high
      - id: ux-qa
        title: UX QA
        description: Walk the UI like a picky end user and flag what looks off.
        levels:
          - description: 'spot-check: a quick pass over the changed surface'
            cell:
              target: fable
              effort: medium
          - description: 'full pass: a pixel-level UX audit of the whole flow'
            cell:
              target: fable
              effort: high
          - description: 'level 3: deeper than level 2 - describe when the Dispatcher should pick this level'
            cell:
              target: fable
              effort: xhigh
      - id: walkthrough
        title: Walkthrough
        description: Record a self-verified evidence walkthrough (video) of a working flow.
        levels:
          - description: record and self-verify an evidence walkthrough of a working flow
            cell:
              target: opus
              effort: high
      - id: validate
        title: Validate
        description: Run the validation pipeline over the work.
        levels:
          - description: run the validation gates over the current work
            cell:
              target: cc-sonnet
              effort: low
      - id: codex-checkpoint
        title: Codex Checkpoint
        description: Run the decorrelated codex checkpoint over the run.
        levels:
          - description: run the cross-model codex checkpoint
            cell:
              target: cc-sonnet
              effort: low
      - id: report
        title: Report
        description: Compose and deliver the run report.
        levels:
          - description: compose and deliver the end-of-run report
            cell:
              target: cc-sonnet
              effort: low
      - id: probe-question
        title: Probe Question
        description: Answer a health-probe question with one short reply.
        levels:
          - description: answer a routing probe with a single short reply
            cell:
              target: cc-sonnet
              effort: low
      - id: dispatch
        title: Dispatch
        description: Read an inbound task and route it to the right duty and level.
        levels:
          - description: >-
              Single-shot structured classification of the task into (duty, level) on a small fast
              model — the default dispatch cell.
            cell:
              target: dispatch-fast
              effort: medium
    selected_duties:
      - code
      - other
      - research
      - discuss
      - plan
      - implement
      - review
      - drill
      - test
      - image
      - video
      - writing
      - ops
      - adversarial-review
      - ux-qa
      - probe-question
      - dispatch
    targets:
      - id: dispatch-fast
        runtime: agent-sdk
        model: claude-haiku-4-5
        provider: anthropic
        params:
          type: single-shot
      - id: cc-haiku
        runtime: agent-sdk
        model: haiku
        provider: anthropic
        params:
          type: runtime-target
          promptMode: coding
      - id: sec-gemini
        runtime: gemini
        model: gemini-2.5-flash
        params:
          type: secondary
      - id: sec-codex
        runtime: codex
        model: gpt-5-codex
        params:
          type: secondary
      - id: classifier
        runtime: agent-sdk
        model: haiku
        provider: anthropic
        params:
          type: runtime-target
          pinned: true
      - id: cc-opus
        runtime: agent-sdk
        model: opus
        provider: anthropic
        params:
          type: runtime-target
          promptMode: coding
          maxTurns: 100
      - id: cc-sonnet
        runtime: agent-sdk
        model: sonnet
        provider: anthropic
        params:
          type: runtime-target
          promptMode: coding
          maxTurns: 100
      - id: sdk-haiku
        runtime: agent-sdk
        model: claude-haiku-4-5
        provider: anthropic
        params:
          type: runtime-target
          authMode: api-key
      - id: sol
        runtime: codex
        model: gpt-5.6-sol
        provider: anthropic
        params:
          type: secondary
          authMode: api-key
      - id: fable
        runtime: agent-sdk
        model: claude-fable-5
        provider: anthropic
        params:
          type: runtime-target
          authMode: subscription
          promptMode: coding
          maxTurns: 100
      - id: opus
        runtime: agent-sdk
        model: claude-opus-4-8
        provider: anthropic
        params:
          type: runtime-target
          authMode: subscription
          promptMode: coding
          maxTurns: 100
