name: jarvis-agentic-os
version: 0.1.0
target: claude
dependencies:
  apm:
    - path: ../../fittings/seed/automations
    - path: ../../fittings/seed/browser-default
    - path: ../../fittings/seed/dev-env
    - path: ../../fittings/seed/drill
    - path: ../../fittings/seed/duty-discuss
    - path: ../../fittings/seed/file-browser
    - path: ../../fittings/seed/garrison-assistant
    - path: ../../fittings/seed/orchestrator
    - path: ../../fittings/seed/google
    - path: ../../fittings/seed/http-gateway
    - path: ../../fittings/seed/improver
    - path: ../../fittings/seed/jarvis-os
    - path: ../../fittings/seed/kanban-loop
    - path: ../../fittings/seed/knowledge
    - path: ../../fittings/seed/local-voice
    - path: ../../fittings/seed/monitor-default
    - path: ../../fittings/seed/ports-default
    - path: ../../fittings/seed/power-default
    - path: ../../fittings/seed/screen-share-default
    - path: ../../fittings/seed/snapshots-default
    - path: ../../fittings/seed/spotify
    - path: ../../fittings/seed/trello
    - path: ../../fittings/seed/vault-git-sync
    - path: ../../fittings/seed/web-channel-default
    - path: ../../fittings/seed/whatsapp-web
x-garrison:
  composition:
    schema: 4
    id: jarvis
    name: Jarvis Agentic OS
    global_config:
      projects_root: ~/dev
      vault: default
      platform: claude-code
      guardrails:
        max_tasks_per_tick: 10
        max_spend_per_day: 250
        max_tool_calls_per_tick: 300
      permissions_mode: auto
      observability_config:
        log_sink: runner
    selections:
      orchestrator:
        - id: orchestrator
          config: {}
      channels:
        - id: web-channel-default
          config:
            bind_host: 127.0.0.1
        - id: whatsapp-web
          config:
            bind_host: 127.0.0.1
            session_dir: ~/.config/garrison/whatsapp-web
            min_send_delay_ms: 1200
            max_send_delay_ms: 3500
        - id: jarvis-os
          config:
            bind_host: 127.0.0.1
            gateway_url: ''
            vad_redemption_ms: 550
            endpoint_min_ms: 350
            endpoint_max_ms: 2600
            bargein_confirm_ms: 350
            bargein_prob: 0.55
            wake_idle_timeout_s: 90
        - id: local-voice
          config:
            bind_host: 127.0.0.1
            kokoro_voice: bm_george
            pause_comma: 0.08
            pause_clause: 0.15
            pause_sentence: 0.22
            pause_question: 0.27
            pause_ellipsis: 0.34
            pause_para: 0.42
            min_clause: 26
            whisper_model: large-v3
            whisper_lang: pt
            tts_force_lang: pt
            stt_engine: whisper-cpp
            whisper_cpp_model: ~/.cache/whisper-cpp/ggml-WhisperLv3-FT-EP-f16.bin
            whisper_cpp_no_timestamps: true
            stt_normalize_gain: 'on'
            wake_word: 'on'
            wake_threshold: 0.5
      runtimes:
        - id: claude-code-runtime
          config:
            account: auto
        - id: agent-sdk-runtime
          config:
            provider: anthropic
            model: ''
            promptMode: coding
            maxTurns: 500
            account: ''
      gateway:
        - id: http-gateway
          config:
            bind_host: 127.0.0.1
            orchestrator_mode: true
            model: haiku
      memory:
        - id: knowledge
          config:
            vault_dir: vault
      observability:
        - id: kanban-loop
          config:
            bind_host: 127.0.0.1
            outpost_host_url: http://127.0.0.1:3702
            board_dir: ~/.garrison/kanban-loop
            iteration_cap: 10
            test_beat_cron: 0 */5 * * *
        - id: automations
          config:
            bind_host: 127.0.0.1
        - id: improver
          config:
            bind_host: 127.0.0.1
            cron: 30 3 * * *
            vault_dir: ~/ObsidianVault
            memory_primary: true
            checkpoint_retention_days: 14
            dream_model: haiku
        - id: monitor-default
          config:
            bind_host: 127.0.0.1
            poll_interval_ms: 1000
            log_retention_hours: 24
      sessions:
        - id: dev-env
          config:
            bind_host: 127.0.0.1
            use_tmux: 'off'
        - id: file-browser
          config:
            bind_host: 127.0.0.1
            root: ~/.garrison/files
        - id: vault-git-sync
          config:
            vault_dir: ~/ObsidianVault
        - id: garrison-assistant
          config:
            bind_host: 127.0.0.1
        - id: snapshots-default
          config:
            projects_root: ~/dev
      surfaces:
        - id: browser-default
          config:
            bind_host: 127.0.0.1
            viewport_width: 1600
            viewport_height: 1200
            jpeg_quality: 70
            every_nth_frame: 1
        - id: ports-default
          config:
            bind_host: 127.0.0.1
            scan_interval_ms: 5000
        - id: power-default
          config:
            bind_host: 127.0.0.1
            idle_minutes: 30
            load_threshold: 1
        - id: screen-share-default
          config:
            bind_host: 127.0.0.1
      building:
        - id: drill
          config:
            bind_host: 127.0.0.1
        - id: duty-discuss
          config: {}
      connectors:
        - id: trello
          config: {}
        - id: google
          config: {}
        - id: spotify
          config: {}
    souls:
      - id: engineer
        prompt: souls/engineer.md
        base_path: ~/dev
      - id: architect
        prompt: souls/architect.md
        base_path: ~/dev
      - id: researcher
        prompt: souls/researcher.md
      - id: assistant
        prompt: souls/assistant.md
      - id: companion
        prompt: souls/companion.md
    prompt_sources:
      orchestrator: .garrison/prompts/orchestrator.md
