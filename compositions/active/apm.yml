name: dogfood-operative
version: 0.1.0
target: claude
dependencies:
  apm:
    - path: ../../fittings/seed/jarvis-os
x-garrison:
  composition:
    id: active
    name: Dogfood Operative
    global_config:
      projects_root: ~/dev
      vault: default
      platform: claude-code
      guardrails:
        max_tasks_per_tick: 5
        max_spend_per_day: 25
        max_tool_calls_per_tick: 30
      permissions_mode: auto
      observability_config:
        log_sink: runner
    selections:
      channels:
        - id: jarvis-os
          config:
            port: 7097
            bind_host: 127.0.0.1
            gateway_url: ''
            tls_cert: ''
            tls_key: ''
            vad_redemption_ms: 550
            endpoint_min_ms: 350
            endpoint_max_ms: 2600
            bargein_confirm_ms: 350
            bargein_prob: 0.55
            wake_idle_timeout_s: 90
            ambient_after_s: 180
            project_root: ''
    prompt_sources:
      orchestrator: .garrison/prompts/orchestrator.md
      soul: .garrison/prompts/soul.md
