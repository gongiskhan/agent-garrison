<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Files</title>
<style>
/* Garrison editorial skin: paper, ink, sage, brass. No CDN, no build step - this
   fitting ships zero dependencies and a single file is the honest shape for it. */
:root {
  --paper: #fbf8f1;
  --paper-2: #f4ede0;
  --paper-3: #ede4d3;
  --rule: #d6cdba;
  --rule-2: #c4b89f;
  --ink: #1f2a22;
  --ink-2: #2f3128;
  --mute: #66695f;
  --mute-2: #7d8077;
  --sage: #3d6249;
  --sage-soft: #eaf1e7;
  --brass: #746232;
  --alarm: #8c3a2e;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14170f; --paper-2: #191d14; --paper-3: #20251a;
    --rule: #333a2b; --rule-2: #46503a;
    --ink: #e9e6da; --ink-2: #d7d3c4; --mute: #9aa08f; --mute-2: #848a79;
    --sage: #8fbf9c; --sage-soft: #1d2a20; --brass: #c6ab63; --alarm: #e08a7c;
  }
}
* { box-sizing: border-box; }
/* A later `display` rule beats the [hidden] attribute, which silently un-hides
   anything toggled that way - the back button showed on phones before a file was
   even open. State it once, with the weight to win. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── Masthead ─────────────────────────────────────────────────────────────── */
header.bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--paper-2); border-bottom: 1px solid var(--rule);
  flex: 0 0 auto; min-width: 0;
}
.brand {
  font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--brass); flex: 0 0 auto;
}
.srcwrap { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
select.src {
  font: 500 12.5px/1 var(--mono); color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule-2); border-radius: 3px;
  padding: 7px 9px; min-width: 0; flex: 1 1 auto; max-width: 340px; min-height: 34px;
}
.ro {
  flex: 0 0 auto;
  font: 600 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--brass); border: 1px solid var(--rule-2); border-radius: 999px;
  padding: 3px 7px; white-space: nowrap;
}
.spacer { flex: 1 1 auto; }
button.ghost {
  flex: 0 0 auto; white-space: nowrap;
  font: 500 12px/1 var(--mono); color: var(--mute);
  background: none; border: 1px solid transparent; border-radius: 3px;
  padding: 7px 8px; min-height: 34px; cursor: pointer;
}
button.ghost:hover { color: var(--ink); border-color: var(--rule); }

/* ── Shell ────────────────────────────────────────────────────────────────── */
main { flex: 1 1 auto; display: flex; min-height: 0; }
aside {
  width: 300px; flex: 0 0 auto; display: flex; flex-direction: column;
  background: var(--paper-2); border-right: 1px solid var(--rule); min-height: 0;
}
.filterwrap { padding: 9px 10px; border-bottom: 1px solid var(--rule); }
input.filter {
  width: 100%; font: 12.5px/1 var(--mono); color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule-2); border-radius: 3px;
  padding: 8px 9px; min-height: 34px;
}
input.filter::placeholder { color: var(--mute-2); }
.crumbs {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px;
  padding: 8px 10px; border-bottom: 1px solid var(--rule);
  font: 11.5px/1.6 var(--mono); color: var(--mute);
}
.crumbs button {
  font: inherit; color: var(--sage); background: none; border: none;
  padding: 2px 3px; cursor: pointer; border-radius: 2px;
}
.crumbs button:hover { text-decoration: underline; }
.crumbs .sep { color: var(--rule-2); }
.crumbs .here { color: var(--ink); padding: 2px 3px; }

ul.list { list-style: none; margin: 0; padding: 4px 0 24px; overflow-y: auto; flex: 1 1 auto; }
ul.list li { margin: 0; }
.row {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 12px; min-height: 40px;
  font: 13px/1.35 var(--mono); color: var(--ink-2); text-align: left;
  background: none; border: none; border-left: 2px solid transparent; cursor: pointer;
}
.row:hover { background: var(--paper-3); }
.row.sel { background: var(--sage-soft); border-left-color: var(--sage); color: var(--ink); }
.row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sz { flex: 0 0 auto; font-size: 10.5px; color: var(--mute-2); font-variant-numeric: tabular-nums; }
/* Type marks: a glyph-free shape so the list reads at a glance without emoji. */
.mk { flex: 0 0 auto; width: 9px; height: 9px; border: 1.5px solid var(--mute-2); }
.mk.dir { border-radius: 2px; background: var(--mute-2); }
.mk.file { border-radius: 2px; }
.mk.up { border: none; width: 12px; color: var(--sage); font-size: 12px; line-height: 1; }

/* ── Viewer ───────────────────────────────────────────────────────────────── */
section.view { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vhead {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--paper-2);
}
.vname { font: 600 14px/1.3 var(--mono); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.vmeta { font: 11px/1.4 var(--mono); color: var(--mute-2); font-variant-numeric: tabular-nums; }
.vbody { flex: 1 1 auto; overflow: auto; min-height: 0; }
pre.code {
  margin: 0; padding: 14px 16px 40px;
  font: 12.5px/1.65 var(--mono); color: var(--ink-2);
  white-space: pre; tab-size: 2;
}
pre.code .ln {
  display: inline-block; width: 3.5em; margin-right: 14px;
  color: var(--rule-2); text-align: right; user-select: none;
}
.md { padding: 18px 22px 48px; max-width: 74ch; font-family: var(--serif); font-size: 16px; line-height: 1.62; }
.md h1, .md h2, .md h3 { font-family: var(--serif); line-height: 1.25; margin: 1.4em 0 .5em; }
.md h1 { font-size: 26px; } .md h2 { font-size: 21px; } .md h3 { font-size: 17px; }
.md code { font: 13px var(--mono); background: var(--paper-3); padding: 1px 4px; border-radius: 2px; }
.md pre { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--sage); }
.md blockquote { margin: 1em 0; padding-left: 14px; border-left: 2px solid var(--rule-2); color: var(--mute); }
.imgwrap { padding: 20px; }
.imgwrap img { max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 3px; }

.note {
  margin: 0; padding: 9px 16px;
  font: 11.5px/1.5 var(--mono); color: var(--brass);
  background: var(--paper-3); border-bottom: 1px solid var(--rule);
}
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; height: 100%; padding: 40px 24px; text-align: center; color: var(--mute);
}
.empty .t { font: 600 13px/1.4 var(--mono); color: var(--ink-2); letter-spacing: .02em; }
.empty .s { font-size: 12.5px; max-width: 42ch; line-height: 1.55; }
.err { color: var(--alarm); }

/* ── Phone: one pane at a time ────────────────────────────────────────────── */
.back { display: none; }
@media (max-width: 760px) {
  aside { width: 100%; border-right: none; }
  main.on-file aside { display: none; }
  main:not(.on-file) section.view { display: none; }
  /* Not `display: inline-flex` unconditionally - that is what overrode [hidden].
     Only the phone LAYOUT is different; visibility stays the script's business. */
  .back:not([hidden]) { display: inline-flex; }
  /* The bar carries five controls and a phone has room for about three. Drop the
     wordmark (the app is already on screen) and let the rest keep full size
     rather than overlapping, which is what a squeezed nowrap row does. */
  .brand { display: none; }
  header.bar { gap: 8px; padding-inline: 10px; }
  .ro { display: none; }
  main.on-file ~ * .ro { display: none; }
  #copy { display: none; }
  .md { padding: 16px 16px 40px; font-size: 15.5px; }
  pre.code { font-size: 12px; }
  pre.code .ln { width: 2.6em; margin-right: 10px; }
}
</style>
</head>
<body>
<header class="bar">
  <span class="brand">Files</span>
  <div class="srcwrap">
    <select class="src" id="src" aria-label="Source"></select>
    <span class="ro" id="ro" hidden>read-only</span>
  </div>
  <span class="spacer"></span>
  <button class="ghost back" id="back" hidden>&larr; Files</button>
  <button class="ghost" id="copy" hidden>Copy path</button>
  <button class="ghost" id="refresh" title="Reload this directory">Refresh</button>
</header>

<main id="shell">
  <aside>
    <div class="filterwrap">
      <input class="filter" id="filter" type="search" placeholder="Filter this folder" autocomplete="off" spellcheck="false" />
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <ul class="list" id="list"></ul>
  </aside>
  <section class="view">
    <div class="vhead" id="vhead" hidden>
      <span class="vname" id="vname"></span>
      <span class="spacer"></span>
      <span class="vmeta" id="vmeta"></span>
    </div>
    <p class="note" id="note" hidden></p>
    <div class="vbody" id="vbody">
      <div class="empty">
        <span class="t">Nothing open</span>
        <span class="s">Pick a file on the left. Switch source at the top to browse a machine an agent is working on.</span>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { sources: [], source: "local", path: "", items: [], file: null, filter: "" };

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtSize = (n) => {
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " kB";
  return (n / 1048576).toFixed(1) + " MB";
};
const currentSource = () => state.sources.find((s) => s.id === state.source) || null;

async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  const data = await res.json().catch(() => ({ error: "the server sent a response this page could not read" }));
  if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

/* ── Sources ─────────────────────────────────────────────────────────────── */
async function loadSources() {
  try {
    const { sources } = await api("/api/sources");
    state.sources = sources;
  } catch {
    state.sources = [{ id: "local", kind: "local", label: "Garrison files", writable: true }];
  }
  const sel = $("src");
  sel.innerHTML = state.sources
    .map((s) => `<option value="${esc(s.id)}">${esc(s.label)}${s.kind === "remote" ? " · remote" : ""}</option>`)
    .join("");
  const remembered = localStorage.getItem("fb.source");
  if (remembered && state.sources.some((s) => s.id === remembered)) state.source = remembered;
  sel.value = state.source;
  syncSourceChrome();
}

function syncSourceChrome() {
  const src = currentSource();
  $("ro").hidden = !src || src.writable !== false;
}

/* ── Directory ───────────────────────────────────────────────────────────── */
async function loadDir(path) {
  state.path = path || "";
  renderCrumbs();
  $("list").innerHTML = `<li><div class="row" style="cursor:default;color:var(--mute-2)">loading…</div></li>`;
  try {
    const data = await api(`/api/tree?source=${encodeURIComponent(state.source)}&path=${encodeURIComponent(state.path)}`);
    state.items = data.items || [];
    state.truncated = Boolean(data.truncated);
    renderList();
  } catch (err) {
    state.items = [];
    $("list").innerHTML = `<li><div class="empty"><span class="t err">Could not open this folder</span><span class="s">${esc(err.message)}</span></div></li>`;
  }
}

function renderCrumbs() {
  const src = currentSource();
  const parts = state.path ? state.path.split("/") : [];
  const bits = [`<button data-go="">${esc(src ? (src.root || src.label).replace(/^.*\//, "") || src.label : "root")}</button>`];
  parts.forEach((part, i) => {
    const upto = parts.slice(0, i + 1).join("/");
    bits.push(`<span class="sep">/</span>`);
    bits.push(i === parts.length - 1
      ? `<span class="here">${esc(part)}</span>`
      : `<button data-go="${esc(upto)}">${esc(part)}</button>`);
  });
  $("crumbs").innerHTML = bits.join("");
}

function renderList() {
  const q = state.filter.trim().toLowerCase();
  const items = q ? state.items.filter((i) => i.name.toLowerCase().includes(q)) : state.items;
  const rows = [];
  if (state.path) {
    const parent = state.path.includes("/") ? state.path.slice(0, state.path.lastIndexOf("/")) : "";
    rows.push(`<li><button class="row" data-dir="${esc(parent)}"><span class="mk up">&larr;</span><span class="nm">..</span></button></li>`);
  }
  for (const it of items) {
    const sel = state.file && state.file.path === it.path ? " sel" : "";
    rows.push(
      `<li><button class="row${sel}" data-${it.type === "dir" ? "dir" : "file"}="${esc(it.path)}">` +
      `<span class="mk ${it.type}"></span><span class="nm">${esc(it.name)}</span>` +
      `<span class="sz">${it.type === "file" ? esc(fmtSize(it.size)) : ""}</span></button></li>`
    );
  }
  if (!rows.length) {
    rows.push(`<li><div class="empty"><span class="t">${q ? "Nothing matches" : "Empty folder"}</span>` +
      `<span class="s">${q ? "Clear the filter to see everything here." : "There are no files in this directory."}</span></div></li>`);
  }
  if (state.truncated) {
    rows.push(`<li><div class="note">Only the first entries are shown - this folder is very large.</div></li>`);
  }
  $("list").innerHTML = rows.join("");
}

/* ── File ────────────────────────────────────────────────────────────────── */
async function openFile(path) {
  $("vhead").hidden = false;
  $("vname").textContent = path.split("/").pop();
  $("vmeta").textContent = "";
  $("note").hidden = true;
  $("copy").hidden = false;
  $("back").hidden = false;
  $("shell").classList.add("on-file");
  $("vbody").innerHTML = `<div class="empty"><span class="s">Opening…</span></div>`;
  try {
    const data = await api(`/api/file?source=${encodeURIComponent(state.source)}&path=${encodeURIComponent(path)}`);
    state.file = { path, ...data };
    renderFile();
    renderList();
  } catch (err) {
    state.file = { path };
    $("vbody").innerHTML = `<div class="empty"><span class="t err">Could not open this file</span><span class="s">${esc(err.message)}</span></div>`;
  }
}

function renderFile() {
  const f = state.file;
  $("vmeta").textContent = [f.size ? fmtSize(f.size) : "", f.kind || ""].filter(Boolean).join("  ·  ");
  if (f.truncated) {
    $("note").hidden = false;
    $("note").textContent = "Showing the first part of this file - it is larger than the browser will pull over the link.";
  }
  if (f.kind === "image") {
    const ext = (f.ext || "png").toLowerCase();
    $("vbody").innerHTML = `<div class="imgwrap"><img alt="${esc(f.path)}" src="data:image/${esc(ext)};base64,${esc(f.content)}" /></div>`;
    return;
  }
  if (f.kind === "markdown") {
    $("vbody").innerHTML = `<article class="md">${markdown(f.content || "")}</article>`;
    return;
  }
  const lines = String(f.content || "").split("\n");
  $("vbody").innerHTML = `<pre class="code">` +
    lines.map((l, i) => `<span class="ln">${i + 1}</span>${esc(l)}`).join("\n") +
    `</pre>`;
}

/* A deliberately small Markdown renderer: headings, code, lists, quotes, links,
   emphasis. Everything is escaped FIRST, so no document content can become
   markup - this fitting will not ship an HTML sanitiser it cannot fully audit. */
function markdown(src) {
  const out = [];
  const lines = esc(src).split("\n");
  let inCode = false, para = [], list = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (/^```/.test(line)) {
      flushPara(); flushList();
      out.push(inCode ? "</code></pre>" : "<pre><code>");
      inCode = !inCode;
      continue;
    }
    if (inCode) { out.push(line); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^&gt;\s?/.test(line)) { flushPara(); flushList(); out.push(`<blockquote>${inline(line.replace(/^&gt;\s?/, ""))}</blockquote>`); continue; }
    const li = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(line);
    if (li) {
      flushPara();
      const want = /\d/.test(li[1]) ? "ol" : "ul";
      if (list !== want) { flushList(); list = want; out.push(`<${want}>`); }
      out.push(`<li>${inline(li[2])}</li>`);
      continue;
    }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  if (inCode) out.push("</code></pre>");
  return out.join("\n");
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*]+)\*/g, "$1<em>$2</em>");
}

/* ── Wiring ──────────────────────────────────────────────────────────────── */
$("list").addEventListener("click", (e) => {
  const btn = e.target.closest("button.row");
  if (!btn) return;
  if (btn.dataset.dir !== undefined) { state.filter = ""; $("filter").value = ""; loadDir(btn.dataset.dir); }
  else if (btn.dataset.file !== undefined) openFile(btn.dataset.file);
});
$("crumbs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-go]");
  if (btn) { state.filter = ""; $("filter").value = ""; loadDir(btn.dataset.go); }
});
$("filter").addEventListener("input", (e) => { state.filter = e.target.value; renderList(); });
$("src").addEventListener("change", (e) => {
  state.source = e.target.value;
  localStorage.setItem("fb.source", state.source);
  state.file = null; state.filter = ""; $("filter").value = "";
  $("vhead").hidden = true; $("note").hidden = true; $("copy").hidden = true;
  $("shell").classList.remove("on-file");
  $("vbody").innerHTML = `<div class="empty"><span class="t">Nothing open</span><span class="s">Pick a file on the left.</span></div>`;
  syncSourceChrome();
  loadDir("");
});
$("refresh").addEventListener("click", () => loadDir(state.path));
$("back").addEventListener("click", () => { $("shell").classList.remove("on-file"); });
$("copy").addEventListener("click", async () => {
  const src = currentSource();
  const full = ((src && src.root) ? src.root.replace(/\/$/, "") + "/" : "") + (state.file ? state.file.path : "");
  try { await navigator.clipboard.writeText(full); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Copy failed"; }
  setTimeout(() => { $("copy").textContent = "Copy path"; }, 1400);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("filter")) { e.preventDefault(); $("filter").focus(); }
  if (e.key === "Escape" && document.activeElement === $("filter")) { state.filter = ""; $("filter").value = ""; renderList(); $("filter").blur(); }
});

(async function boot() {
  await loadSources();
  await loadDir("");
})();
</script>
</body>
</html>
