name: file-browser
version: 0.1.0
description: File Browser — browse and read files in the scoped local workspace AND in the projects remote agents are working in.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: sessions
  category: Interfaces
  cardinality_hint: single
  component_shape: plugin
  own_port: true
  default_port: 8091
  platforms:
    - claude-code
  summary: >-
    Browse and read files from two kinds of SOURCE, with one contract for both.
    `local` is the scoped workspace root (default ~/.garrison/files),
    read/write, path-traversal-confined, and refuses credential files - the
    artifact surface that replaced the artifact-store. Each `remote:<transport>`
    is a project an agent is working in on another machine, read over the ssh
    transport the remote-shell runtime already holds and confined on the REMOTE
    by a realpath check, so a symlink out of the project is caught where the
    truth lives. Remote sources are READ-ONLY on purpose: an agent is running in
    that tree and editing under it would race with work you cannot see. The
    remote-shell fitting's address is discovered through the shell, never guessed
    from a port literal.
  config_schema:
    - key: root
      type: string
      default: ~/.garrison/files
      description: The workspace root the browser is confined to. Never escapes this dir (path-traversal-safe).
    - key: port
      type: integer
      default: 8091
      description: HTTP port; the server exits non-zero when it is taken (no auto-shift).
  provides: []
  consumes: []
  ui:
    views:
      - id: file-browser
        placement: faculty-tab
        entry: ./dist/index.html
        route: /
  setup:
    command: bash scripts/setup.sh
    idempotent: true
    timeout_ms: 15000
  verify:
    command: node apm_modules/_local/file-browser/scripts/server.mjs --probe
    expect: ok
    timeout_ms: 10000
  for_consumers: |
    The Files view is the artifact surface. To hand the user a file, write it
    with a plain filesystem write (mkdir -p the folder, write the file - no
    API involved) under `~/.garrison/files/<namespace>/` (or
    `$GARRISON_FILEBROWSER_ROOT` when set). Namespaces:

    - `documents/` - user-facing markdown, reports, specs
    - `recordings/` - audio, video, screen captures
    - `runs/` - run outputs, logs, evidence from automated work
    - `uploads/` - files the user supplied

    Prefix filenames with the ISO date (`2026-07-10-feature-spec.md`) so
    listings sort chronologically. The user views everything in the Files view
    (sidebar Views) on phone or desktop: markdown renders, images display
    inline, text files are editable.
