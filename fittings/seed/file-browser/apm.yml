name: file-browser
version: 0.1.0
description: >-
  Workspace — browse and read files in the scoped local workspace, in this node's
  git projects, and in the projects remote agents are working in; plus the
  git-aware surface (status, diff, log, fetch) the cross-node merge system runs on.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: sessions
  category: Interfaces
  cardinality_hint: single
  component_shape: plugin
  own_port: true
  default_port: 8091
  platforms:
    - claude-code
  summary: >-
    Browse and read files from three kinds of SOURCE, with one contract for all
    of them. `local` is the scoped workspace root (default ~/.garrison/files),
    read/write, path-traversal-confined, and refuses credential files - the
    artifact surface that replaced the artifact-store. Each `project:<name>` is a
    git repository under this node's dev-root, resolved through the same
    name-only discipline the gateway uses for a channel-supplied project, and it
    is git-aware: status (porcelain v2 plus ahead/behind, with NO implicit
    fetch), diff (500 KB cap, binaries refused), log, and an explicit fetch.
    Each `remote:<transport>` is a project an agent is working in on another
    machine, read over the ssh transport the remote-shell runtime already holds
    and confined on the REMOTE by a realpath check, so a symlink out of the
    project is caught where the truth lives. Confinement is per root, so a path
    inside one project can never reach another. Project and remote sources are
    READ-ONLY on purpose: an agent is running in that tree, and editing under it
    would race work you cannot see - the edit path for a repository is git.
    Cross-node merges are state-mediated: pull-from-others asks every peer to
    commit and push (bounded 120s; silence is reported as no-reply, never
    assumed clean) and then fetches, while push-to-others commits, pushes, and
    files one `merge` duty card per target node so the merge runs on the node
    that owns the tree and is visible on the board.
  config_schema:
    - key: root
      type: string
      default: ~/.garrison/files
      description: The workspace root the browser is confined to. Never escapes this dir (path-traversal-safe).
    - key: port
      type: integer
      default: 8091
      description: HTTP port; the server exits non-zero when it is taken (no auto-shift).
  provides: []
  consumes: []
  ui:
    views:
      - id: file-browser
        placement: faculty-tab
        entry: ./dist/index.html
        route: /
  setup:
    command: bash scripts/setup.sh
    idempotent: true
    timeout_ms: 15000
  verify:
    command: node apm_modules/_local/file-browser/scripts/server.mjs --probe
    expect: ok
    timeout_ms: 10000
  for_consumers: |
    The Files view is the artifact surface. To hand the user a file, write it
    with a plain filesystem write (mkdir -p the folder, write the file - no
    API involved) under `~/.garrison/files/<namespace>/` (or
    `$GARRISON_FILEBROWSER_ROOT` when set). Namespaces:

    - `documents/` - user-facing markdown, reports, specs
    - `recordings/` - audio, video, screen captures
    - `runs/` - run outputs, logs, evidence from automated work
    - `uploads/` - files the user supplied

    Prefix filenames with the ISO date (`2026-07-10-feature-spec.md`) so
    listings sort chronologically. The user views everything in the Files view
    (sidebar Views) on phone or desktop: markdown renders, images display
    inline, text files are editable.

    The git surface, for a repository under this node's dev-root
    (`source=project:<name>`):

    - `GET  /api/git/status?source=` — branch, upstream, ahead/behind, dirty
      entries, stash count, in-progress merge/rebase. Instant and
      side-effect-free: it does NOT fetch.
    - `POST /api/git/fetch {source}` — the only call that reaches a remote.
    - `GET  /api/git/diff?source=&path=&staged=` — unified diff, 500 KB cap; a
      single binary path is refused rather than answered with a placeholder.
    - `GET  /api/git/log?source=&limit=`

    And the two cross-node merge actions, both mediated by the state service:

    - `POST /api/git/pull-from-others {project}` — asks every other node to
      commit and push, waits 120s, fetches, and reports per node. It does NOT
      merge; that is the `merge` duty's job.
    - `POST /api/git/push-to-others {project}` — commits and pushes this node's
      branch, then files one `merge` duty card per target node.
    - `POST /api/git/commit-push {project}` — this node's executor; skipped when
      a session is running with that repository as its cwd.
