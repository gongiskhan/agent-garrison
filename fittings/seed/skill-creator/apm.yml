name: skill-creator
version: 0.1.0
description: >-
  Guide for creating effective skills. This skill should be used when users want to create a new skill (or update an existing skill) that extends Claude's capabilities with specialized knowledge, workflows, or tool integrations.
target: claude
type: skill
includes: auto
x-garrison:
  faculty: building
  category: Building
  cardinality_hint: single
  component_shape: skill
  ui:
    views:
      - id: skill
        placement: sidebar-surface
        entry: garrison:skill
        route: /
  platforms:
    - claude-code
  summary: >-
    Guide for creating effective skills. This skill should be used when users want to create a new skill (or update an existing skill) that extends Claude's capabilities with specialized knowledge, workflows, or tool integrations.
  provides:
    - kind: agent-skill
      name: skill-creator
  consumes: []
  verify:
    command: test -f apm_modules/_local/skill-creator/.apm/skills/skill-creator/SKILL.md && echo ok
    expect: ok
    timeout_ms: 10000
