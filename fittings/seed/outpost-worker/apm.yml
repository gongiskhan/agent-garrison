name: outpost-worker
version: 0.1.0
description: >-
  Pull-based dispatch worker for a Garrison outpost. Runs ON a remote machine,
  polls the host for cards placed on it, claims one, runs it, heartbeats, and
  reports a terminal status with evidence copied back to the host board.

x-garrison:
  faculty: coordination
  summary: >-
    The remote half of Outpost Dispatch. Polls the host's /api/dispatch API with
    this machine's pairing token, claims cards whose placement names it, and
    reports back. Never dialled by the host - a machine that is asleep simply
    stops asking, so work is never pushed into the void.
  component_shape: cli
  cardinality_hint: single
  platforms:
    - claude-code
  # Not an own-port fitting: the worker serves nothing. It is an outbound
  # poller, which is exactly what lets it live on a machine with no inbound
  # reachability at all.
  own_port: false
  config_schema:
    - key: dispatch_url
      type: string
      default: ""
      description: >-
        Base URL of the Garrison host, as reachable FROM this machine - the
        tailnet address, never a loopback one. Empty disables the worker.
    - key: machine_name
      type: string
      default: ""
      description: This machine's name in the host's outpost registry.
    - key: poll_seconds
      type: integer
      default: 15
      description: Seconds between polls when idle. A claimed card polls again immediately.
  secret_scope:
    # The pairing token is the machine's identity. Vault-scoped so it is
    # delivered to this fitting and nothing else.
    - GARRISON_DISPATCH_TOKEN
  provides:
    - kind: duty
      name: outpost-worker
  consumes:
    - kind: vault
      cardinality: optional-one
  verify:
    command: node scripts/verify.mjs
    expect: OUTPOST-WORKER-OK
    timeout_ms: 10000
  for_consumers: |
    The Outpost Worker is how a card runs on a machine that is not the Garrison
    host. It is INSTALLED ON the outpost, not on the host.

    A card carries `placement: { target, not_before? }`. `target: "host"` (the
    default) runs locally exactly as before. Any other value names a machine in
    the outpost registry, and the local engine then refuses to run that card at
    all - it waits, untouched, for that machine's worker to claim it. There is
    no silent fallback to running on the host: not-ours means not-ours.

    Claiming is compare-and-swap on the card's `rev`, so two workers that pick
    the same card cannot both win. A claim is held by heartbeat; miss the lease
    and the card is reclaimed and returned to needs-attention with the machine
    named, its placement cleared so it can be re-dispatched anywhere.
