name: web-channel-default
version: 0.1.0
description: Legacy own-port host of the Conversations engine (packages/talk). The shell serves the same engine at /talk; station this only to keep the old port-bound surface alive.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: channels
  category: Interfaces
  cardinality_hint: single
  own_port: true
  default_port: 8083
  component_shape: plugin
  platforms:
    - claude-code
  summary: Legacy host. Serves the @garrison/talk conversation UI and API on its own port (the `port` config value, shifted by the instance profile); the Garrison shell serves the same engine at /talk and /api/*, sharing the thread store, so this fitting is unstationed by default. Proxies the http-gateway's POST /chat/stream for outbound turns and GET /channels/web/stream for live + last-100-event replay; it never spawns Claude itself.
  config_schema:
    - key: port
      type: integer
      default: 8083
      description: HTTP port the web-channel server binds to. The server refuses to start (exit 1) when the port is taken - no auto-shift.
    - key: bind_host
      type: string
      default: 127.0.0.1
      description: Bind address. Set to 0.0.0.0 to expose to the LAN (e.g. phone access).
    - key: gateway_url
      type: string
      default: ""
      description: Optional override for the upstream http-gateway URL. Defaults to the GARRISON_GATEWAY_URL env the runner projects, else the GARRISON_GATEWAY_HOST/GARRISON_GATEWAY_PORT pair.
    - key: tls_cert
      type: path
      default: ""
      description: Optional TLS certificate path. When set with tls_key, serves https so mobile browsers get a secure context (required for mic capture over a LAN IP). Prefer `tailscale serve` for a managed cert; this is the in-app fallback.
    - key: tls_key
      type: path
      default: ""
      description: Optional TLS private key path; pairs with tls_cert.
  provides:
    - kind: channel
      name: web
  consumes:
    - kind: voice
      cardinality: optional-one
    # Required for the VAPID keys below to be delivered at all: vaultEnvForEntry
    # gates secret delivery on a declared vault consumption, so a secret_scope
    # without this is silently ignored (it logs "consumes vault but declares no
    # secret_scope"'s inverse - no warning at all, just no secrets).
    - kind: vault
      cardinality: one
  # Web Push identity. The PUBLIC key is baked into every browser
  # subscription, so rotating it invalidates all of them - treat as durable.
  secret_scope:
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    # The voice provider gates its /stt and /tts with this token; the router
    # forwards it as a Bearer on the upstream hop only (the page never sees it).
    - CAPTURE_TOKEN
  setup:
    command: node ui/build.mjs
    idempotent: true
    timeout_ms: 60000
  verify:
    command: node apm_modules/_local/web-channel-default/scripts/probe.mjs --probe
    expect: ok
    timeout_ms: 10000
  for_consumers: |
    The web-channel Fitting is the session's mobile surface — now a rich
    Claude Code chat (markdown replies, real status line, mode switcher,
    slash/skill autocomplete, collapsible raw terminal). The UI is the shared
    @garrison/claude-chat component talking to the http-gateway's PTY-backed
    /claude/* surface, proxied here as /api/claude/* (stream SSE + status,
    commands, message, keys, mode, interrupt). The legacy bubble+voice UI was
    retired (history in git); voice now lives in the current
    voice-conversation / voice-capture / pcm-worklet AudioWorklet path.

    The Orchestrator does not call it directly — the browser drives. The
    legacy /api/chat → /chat/stream and /api/stream → /channels/web/stream
    relays remain for compatibility.

    Channel id: "web" — set as the `channel` field on inbound /chat/stream
    requests. When the Orchestrator publishes assistant replies, they
    are multiplexed into the "web" channel ring buffer and any open SSE
    subscribers (i.e. open browser tabs) receive them.

    Status file at ~/.garrison/ui-fittings/web-channel-default.json
    carries:
      { fittingId, port, url, pid, startedAt }

    Endpoints (served by this Fitting on its own port):
      GET  /health           → liveness
      GET  /api/health       → liveness
      GET  /api/stream       → SSE proxy of gateway /channels/web/stream
      POST /api/chat         → SSE proxy of gateway /chat/stream (body: {message})
      GET  /api/voice→ { available, url? } — opportunistic voice (kind:voice) discovery
      POST /api/voice/stt    → binary proxy to the voice Fitting's /stt (audio → { transcript })
      POST /api/voice/tts    → binary proxy to the voice Fitting's /tts ({text} → audio bytes)
      GET  /                 → React chat UI (dist/index.html)

    Voice is optional: when a kind:voice Fitting (capture-service) is
    stationed, the browser UI shows a mic button (push-to-talk → /api/voice/stt),
    a per-reply speaker button, and a "read aloud" toggle (auto-speaks completed
    replies via /api/voice/tts). The voice Fitting holds the API key; the browser
    only ever talks to this same-origin proxy.
