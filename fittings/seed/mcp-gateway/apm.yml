name: garrison-mcp-gateway
version: 0.2.0
description: MCP gateway Fitting for Agent Garrison interactive (UI-tab-launched) sessions.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: gateway
  category: Core
  cardinality_hint: multi
  component_shape: script
  ui:
    views:
      - id: manage
        placement: sidebar-surface
        entry: garrison:manage
        route: /
  platforms:
    - claude-code
  summary: Exposes installed Faculties as MCP tools to interactive (UI-tab-launched) Claude Code sessions.
  config_schema:
    - key: bind_host
      type: string
      default: "0.0.0.0"
      description: HTTP transport bind host (must be Tailscale-reachable for remote outposts).
  provides:
    - kind: mcp-gateway
      name: mcp-gateway
  consumes:
    - kind: orchestrator
      cardinality: optional-one
  setup:
    command: bash scripts/setup.sh
    idempotent: true
    timeout_ms: 120000
  verify:
    command: node apm_modules/_local/mcp-gateway/scripts/gateway.mjs --probe
    expect: ok
    timeout_ms: 8000
  for_consumers: |
    Faculty-tool sidecar - not invoked directly by the session. Interactive
    sessions use it as a stdio MCP child (no port of its own); remote outpost
    sessions connect over HTTP MCP instead. Delegation is owned by the active
    runtime/orchestration layer, not by persona-named Soul sessions.

    Assistant reads available in every working session:
      - garrison_list_cards(query?, list?, project?, include_closed?, offset?, limit?):
        read the live board, paging through next_offset; open cards by default.
      - garrison_get_card(card): read description, checklist and progress by id,
        suffix or title; ambiguous references return candidates.
      - garrison_list_connectors(connector?): equipped services, connection state
        and action catalog. Credentials never appear in the result.
      - garrison_connector_read(connector, action, args?): call an action explicitly
        declared mutates=false, using the existing scoped credential invoker.
        For today's agenda read both Kanban and Google calendar.list_events with
        time_min/time_max for the user's local day. Report actual connection
        failures; do not claim tools are missing without trying them.

    Kanban run-engine tools (WS2, present when the kanban-loop board is live at
    ~/.garrison/ui-fittings/kanban-loop.json):
      - fetch_evidence(card_id, artifact_ref): pull one card artifact (raw text,
        capped ~50KB) by its opaque ref token (plan | brief | evidenceIndex |
        gateMarkers | evidence:<file> | session:<i> | log:<n>). Pull, not push.
      - create_continuation(card_id, title?, description?): register a successor
        card (continues=<card_id>, moved to plan) whose prompt is seeded from the
        predecessor's handoff packet; returns { id, url }.
      - poll_origin_events(origin_id, since?): PULL the lifecycle + duty-summary
        events for a run origin (skill/terminal parity with a web thread's push
        feed) - created | needs-input | blocked | failed | finished | duty-summary
        | steering; poll again with the returned next_since for only new events.
      - schedule_card(card, until? | in_minutes?, action?, clear?): schedule or
        snooze a card by spoken ref (the executable "snooze card 7Q2M for 2
        hours") - resolves full ULID / ULID suffix >= 3 chars / title fragment,
        sets scheduledFor + re-arms the reminder; clear=true removes the hold;
        an ambiguous ref returns candidates to relay, never a guess.
      - run_card(card): start/advance a card NOW by spoken ref (the executable
        "run card 7Q2M"); the start itself clears any schedule on the card.
      - list_scheduled_cards(): compact table of every card holding a schedule
        (short ref, title, due instant, action notify|run, list).
    NOTE: "continuation" here is CARD CHAINING (one card continues another's work),
    DISTINCT from the Orchestrator policy's post-task "continuations" vocabulary
    (store|ask|route|notify steps by output kind).
