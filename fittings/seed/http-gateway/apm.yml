name: http-gateway
version: 0.2.0
description: HTTP gateway seed for Agent Garrison.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: gateway
  category: Core
  cardinality_hint: multi
  component_shape: script
  ui:
    views:
      - id: manage
        placement: sidebar-surface
        entry: garrison:manage
        route: /
  platforms:
    - claude-code
  summary: Local HTTP gateway. All model turns drive the one routed session through an interactive Claude Code TUI session via @garrison/claude-pty (node-pty + headless xterm).
  config_schema:
    - key: port
      type: integer
      default: 5777
      description: Local gateway port.
    - key: bind_host
      type: string
      default: 127.0.0.1
      description: Local bind address.
    # Compact controller (S1b). Global defaults; a per-runtime override map may be
    # carried in the same config object under `compaction` (keys: claude-code,
    # agent-sdk, openai-agents, codex, opencode) and is projected as JSON to the
    # gateway. The default focus template lives in the fitting
    # (scripts/lib/compact-focus-template.mjs); leave compact_focus_template empty
    # to use it.
    - key: session_log_proxy
      type: boolean
      default: false
      description: >-
        Route Anthropic-bound runtime traffic through a loopback logging proxy
        that records the literal API request/response into the session log
        (api-domain events, credentials redacted). Audit-grade "what the model
        saw"; off by default.
    - key: session_log_proxy_dump
      type: string
      default: ''
      description: >-
        Directory the logging proxy additionally writes each literal request
        body to, whole and untruncated (bodies only - never headers, so no
        credentials). Empty disables it. Only meaningful with
        session_log_proxy on; for auditing an assembled prompt the session
        log's payload cap makes unusable.
    - key: stretch_claude_home
      type: boolean
      default: false
      description: >-
        Point spawned stretches at a Garrison-owned CLAUDE_CONFIG_DIR
        ($GARRISON_HOME/stretch-claude) instead of the user's real ~/.claude.
        With the real one, the CLI injects the personal memory index, the
        personal skills list and the agent-type list into every stretch - about
        6,300 tokens on sonnet, shipped to every provider a stretch runs on, and
        changing whenever personal memory changes, which forks the byte-stable
        prefix that cross-stretch cache sharing needs. The Garrison directory
        carries only symlinked credentials and a seeded state file.
    - key: prefix_cache_ttl
      type: string
      default: ''
      description: >-
        Rewrite the cache_control TTL on the SYSTEM breakpoints of every
        Anthropic request to "1h" (or "5m"). A stretch is a fresh session, so
        with the 5-minute default each one re-writes the same ~43k boot prefix
        instead of reading the previous stretch's. A 1h write costs 2x base
        input against 1.25x and every later read is 0.1x, so it pays back the
        first time a second stretch reuses it. Requires session_log_proxy.
        Empty leaves the SDK's own choice alone.
    - key: prefix_tool_search
      type: string
      default: ''
      description: >-
        Defer tool loading behind the API's tool search tool - "regex" or
        "bm25". Every tool except those in prefix_tool_search_keep is sent with
        defer_loading:true and discovered on demand. Measured 90.3% smaller tool
        block on haiku. EXPERIMENTAL: the Agent SDK must round-trip the
        server_tool_use and tool_search_tool_result blocks for the conversation
        to continue. Requires session_log_proxy. Empty disables it.
    - key: prefix_tool_search_keep
      type: string
      default: 'Bash,Read,Write,Edit'
      description: >-
        Comma-separated tools that stay loaded when prefix_tool_search is on,
        or "none" to defer every one of them. The published advice to keep three
        to five hot tools is written for interactive latency; a deferred tool
        expands inline into the messages and is cached for the rest of the
        stretch, so a long agentic stretch pays one search plus one expansion
        rather than anything per call. Keeping Bash/Read/Write/Edit leaves 6,562
        of a 7,077-token block on the table.
    - key: strict_project_resolution
      type: boolean
      default: true
      description: >-
        Refuse to start a conversation whose card names a project that does not
        resolve on this machine, instead of silently running its stretches in the
        composition directory. The card is parked on Needs input and the ledger
        carries a project-unresolved entry naming the requested project, what it
        resolved to, the directory the old fallback would have used, and the
        dev-root rule. Set to false to restore the pre-2026-08-31 fallback.
    - key: triage_findings
      type: boolean
      default: true
      description: >-
        Carry a per-duty findings expectation in the stretch brief. Triage read
        eight or nine files per run and recorded zero findings: it had the tool
        and the contract, but its duty description names the handoff summary as
        its output, so orientation facts went there instead of into the record
        the next stretch is handed. With this on, triage is told to record where
        things live as anchored `fact` entries before it hands off. Set to false
        to fall back to the shared contract alone.
    - key: compact_enabled
      type: boolean
      default: true
      description: Enable the Garrison compact controller (boundary-only /compact of the session when context usage reaches the threshold).
    - key: compact_threshold_pct
      type: integer
      default: 60
      description: Context-usage percentage at or above which the controller compacts the session at a turn/duty boundary.
    - key: compact_focus_template
      type: string
      default: ""
      description: >-
        Custom compaction focus template. Placeholders {{card_id}} {{card_title}}
        {{duty}} {{level}} {{decisions}} {{open_items}} {{files_touched}}
        {{steering}} are filled from card context; a line whose placeholder is empty
        is dropped. Leave empty to use the built-in default template.
  consumes:
    - kind: orchestrator
      cardinality: one
  verify:
    command: test -f apm_modules/_local/http-gateway/scripts/gateway-pty.mjs && node --input-type=module -e "await import('@garrison/claude-pty')" && command -v claude >/dev/null 2>&1 && echo ok
    expect: ok
    timeout_ms: 15000
  for_consumers: |
    Endpoints: POST /chat, /chat/stream, /jobs, /attachments + GET /health.
    The engine is the PTY-backed interactive Claude TUI (gateway-pty.mjs), with
    duty/level routing inferred by Orchestrator before each turn. /chat/stream
    emits: open, chunk {text}, done {reply, session_id}, error.
