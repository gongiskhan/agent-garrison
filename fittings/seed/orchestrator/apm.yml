name: orchestrator
version: 0.2.0
description: Orchestrator for Agent Garrison — the single routing and identity brain. Owns duty/level inference, the layered runtime prompt, and the compiled execution policy.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: orchestrator
  category: Core
  cardinality_hint: single
  component_shape: system-prompt
  ui:
    views:
      - id: prompt
        placement: sidebar-surface
        entry: garrison:prompt
        route: /
  platforms:
    - claude-code
  summary: >-
    Fills the Orchestrator Faculty — the one policy, one brain. Owns the v2
    policy config (matrix resolving every task type × tier straight to a
    target; phase plans; flows; the phase-skill registry) and compiles it
    byte-stably into both the routing.md injected via {{routing}} and the
    machine-readable ~/.garrison/orchestrator/policy.json (the single
    consumption interface for the run engine and every phase skill). The
    policy is edited from Garrison's Muster Orchestrator tab (whole-document,
    baseline-hash guarded writes through /api/orchestrator/policy).
  config_schema: []
  provides:
    - kind: orchestrator
      name: orchestrator
    - kind: identity
      name: authored
    - kind: duty
      name: dispatch
  consumes: []
  duties:
    - id: dispatch
      title: Dispatch
      description: Read an inbound task and route it to the right duty and level.
      levels:
        - description: >-
            Bounded single-turn routing inference using deterministic policy first
            and the composition's dispatch-fast target only for ambiguous human asks.
          cell:
            target: dispatch-fast
            effort: low
  setup:
    command: node scripts/compile.mjs --check
    idempotent: true
    timeout_ms: 90000
  verify:
    command: node apm_modules/_local/orchestrator/scripts/probe.mjs --probe
    expect: ok
    timeout_ms: 15000
  for_consumers: |
    The Orchestrator owns the editable Identity, routing policy, and the dispatch
    duty. Deterministic rules run before its one-turn dispatch target; ambiguous
    human requests resolve to {duty, level, confidence, evidence} before the
    Operative starts. Its layered authored + generated document is the actual
    runtime prompt and its policy.json remains the machine-readable execution
    policy for the run engine.
    Every reply must end with `[route: <target-id> | rule: <rule-id> | profile: <name>]`.
    The policy is edited from Garrison's Muster Orchestrator tab (whole-document,
    baseline-hash guarded writes via /api/orchestrator/policy; 409 on baseline
    mismatch, 422 when the policy fails to validate or compile; policy.json is
    recompiled on every accepted write).
