name: remote-shell-runtime
version: 0.2.0
description: Shells (Runtimes Faculty) — attaches to a live tmux session on THIS machine or a remote one over ssh (optionally through a Microsoft Dev Tunnel), streams the terminal two-way into Garrison, and drives running/idle lifecycle from the agent's own hooks via an events file. A runtime catalog (claude/codex/cursor/gemini/shell) can start or resume any of them in a pane; a node-wide session index (owned shells + every listed CLI/desktop session on the box) is served at GET /index and published to the mesh so any node's Conversations can show what is running here.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: runtimes
  category: Operations
  cardinality_hint: multi
  component_shape: cli-skill
  own_port: true
  default_port: 8098
  platforms:
    - all
  summary: >-
    One general attach-and-stream runtime, many transports - including a
    `local` transport for THIS machine, behind the exact same seams as every
    ssh transport (its own dedicated tmux socket, never the user's). A
    transport names a reachable machine (ssh target + optional devtunnel to
    ride through, or nothing for local) and a tmux session there; the
    fitting's own-port server keeps the devtunnel client alive, attaches
    under node-pty, streams the real TUI over the dev-env /io WebSocket
    protocol (xterm.js pane), and follows an events file for hook-driven
    running/idle state, turn settlement, and channel notifications. A runtime
    catalog (claude/codex/cursor/gemini/shell) can start a fresh session or
    resume/attach an existing one in a pane; a login-shell probe reports which
    of those CLIs exist on a transport. The RuntimeAdapter face makes any
    transport a routable delegate target. GET /index (and the mesh's
    shells.sessions/node:<name> config doc) lists every owned shell PLUS every
    external claude/codex/cursor/gemini session this node can see on disk, one
    honest status each (hooks > pane > transcript-recency, never a guess).
    Connections to a remote transport are strictly outbound-from-Garrison; the
    remote never dials us.
  config_schema:
    - key: port
      type: integer
      default: 8098
      description: HTTP/WS port the remote-shell server binds to. Bound exactly; exits 1 on EADDRINUSE.
    - key: bind_host
      type: string
      default: 127.0.0.1
      description: Bind address; 0.0.0.0 to expose beyond loopback.
    - key: transports
      type: string
      default: ""
      description: >-
        JSON object of named transports, e.g.
        {"csg":{"ssh":{"host":"127.0.0.1","port":2222,"user":"ggomes",
        "identity":"~/.ssh/garrison-remote-shell"},
        "via":{"devtunnel":{"tunnel":"azr-imvwya5cqhr","port":2222}},
        "tmuxSession":"csg","cwd":"~/dev/pnmui-monorepo",
        "eventsFile":"~/.garrison/events.jsonl",
        "agentCommand":"cursor-agent","label":"CSG work"}}.
        Merged over $GARRISON_HOME/remote-shell/transports.json.
    - key: notify_fittings
      type: string
      default: ""
      description: >-
        Comma-separated fitting ids to restrict agent-stop completion
        notifications to. Empty (default) = discovery fan-out: every running
        fitting's POST /notify, with HTTP 404 meaning "not a channel".
    - key: devtunnel_bin
      type: string
      default: ""
      description: Path to the Microsoft devtunnel CLI. Empty = ~/.local/bin/devtunnel, then PATH.
    - key: token_refresh_minutes
      type: integer
      default: 60
      description: >-
        How often to mint a fresh 24h devtunnel host token and push it to each
        devtunnel-backed remote over the live ssh channel, so that machine never
        needs an interactive `devtunnel user login` of its own. Far under the
        token's lifetime on purpose: the remote keeps working through roughly a
        day of Garrison being down. Env override:
        GARRISON_REMOTESHELLRUNTIME_TOKEN_REFRESH_MIN.
    - key: default_transport
      type: string
      default: ""
      description: Transport the bridge delegate lane uses when the task spec names none.
    - key: tunnel_check_seconds
      type: integer
      default: 20
      description: >-
        How often the tunnel supervisor asks each devtunnel-backed transport's
        ssh port for its banner. Matches host-tunnel.sh's own 20s loop, and for
        the same reason: short enough that an outage is tens of seconds, long
        enough not to interrogate the relay. A transport that carried real
        traffic inside the last tick is skipped entirely, so a busy link is
        never probed. Set to 0 to disable supervision completely — the escape
        hatch if the loop ever misbehaves.
    - key: tunnel_settle_seconds
      type: integer
      default: 45
      description: >-
        How long an off-the-request-path caller waits for a fresh `devtunnel
        connect` to bring its forward up. 45s because a hand-run one was
        observed silent for that long before it settled; the deadline extends
        further (to 90s) while the client is still printing, so a slow relay is
        not mistaken for a dead one.
    - key: attach_output_budget_mb
      type: integer
      default: 8
      description: >-
        Bytes per 10s the terminal attach client may pull before it is detached
        to protect the link (~800 KB/s sustained, an order of magnitude above
        any human-plausible pane). Nothing is lost: the remote tmux is untouched
        and a reattach replays. This is the only storm defence that needs no
        remote round trip, so it is the one that still works when the link is
        saturated.
    - key: reap_strays
      type: boolean
      default: true
      description: >-
        Kill `devtunnel connect` processes for this tunnel that this instance
        does not own, immediately before replacing a client. `children` starts
        empty on every restart, so a client orphaned by a previous process is
        otherwise invisible to every check and keeps holding the loopback port.
        Only ever runs on the repair path — a healthy port is never touched.
    - key: local_shells
      type: boolean
      default: true
      description: >-
        Synthesize a `local` transport for this machine (a dedicated tmux
        socket, never the user's own) when tmux is on PATH. Env override:
        GARRISON_REMOTESHELLRUNTIME_LOCAL_SHELLS=false.
    - key: local_projects_root
      type: string
      default: "~/dev"
      description: Root the project picker lists folders under, for every transport (local included) unless a transport sets its own `projectsRoot`.
    - key: local_login_shell
      type: string
      default: ""
      description: Login shell for the local transport's own commands (bash or zsh; anything else falls back to bash). Empty = $SHELL, then bash.
    - key: install_hooks
      type: boolean
      default: true
      description: >-
        On start, merge (never replace) the agent lifecycle hook into
        Cursor/Codex/Gemini's own config on this box, so hook-driven status
        works for sessions started directly in a terminal too. Claude Code's
        own hooks are untouched (dev-env owns those). Env override:
        GARRISON_REMOTESHELLRUNTIME_INSTALL_HOOKS=false.
    - key: session_window_days
      type: integer
      default: 5
      description: How far back GET /index and the published state-service doc look for a session (live/owned rows are always included regardless of age).
    - key: index_publish_seconds
      type: integer
      default: 10
      description: How often the session index is rebuilt and (re)published to the mesh.
  provides:
    - kind: runtime
      name: remote-shell
  consumes: []
  setup:
    # link-devtunnel-home: the instance XDG redirect hides the box's devtunnel
    # login (same trap as Cursor's auth under XDG_CONFIG_HOME) — link the real
    # token store in before anything needs the tunnel. install-hooks: merge
    # the lifecycle hook into Cursor/Codex/Gemini's own config (idempotent,
    # never under a test runner - see server.mjs's VITEST guard).
    command: node scripts/link-devtunnel-home.mjs && node ui/build.mjs && node scripts/install-hooks.mjs
    idempotent: true
    timeout_ms: 120000
  verify:
    command: node apm_modules/_local/remote-shell-runtime/scripts/probe.mjs
    expect: ok
    timeout_ms: 15000
  for_consumers: |
    Remote-shell-as-secondary. A routing target with runtime `remote-shell`
    delegates the turn to a REMOTE agent living in tmux on another machine.
    The target's `model` slot names the TRANSPORT (e.g. model: "csg") — the
    same one-slot convention Cursor uses for effort-in-model-id. A turn types
    the instruction into the remote agent's TUI (tmux send-keys) and completes
    when the remote agent's own stop hook appends to the remote events file —
    terminal text is never scraped for state. While the turn runs, whatever the
    remote pane prints is read back on a timer and streamed to the caller
    through the adapter's onChunk seam, so a channel shows the work as it
    happens; the settled reply is that same transcript plus the stop timestamp.
    The live TUI itself streams in the fitting's terminal view and in
    web-channel's terminal pane.

    Discovery: ~/.garrison/ui-fittings/remote-shell-runtime.json
    ({fittingId, port, url, pid, startedAt}), then GET <url>/health.

    Reachable CROSS-ORIGIN, on purpose: a browser on another node's page must
    call this fitting directly (Next cannot upgrade WebSockets, so a same-
    origin relay does not exist for /io). Every REST route and the /io
    upgrade go through an Origin/Host guard (lib/origin-guard.mjs, the same
    isTrustedHost rule as src/lib/mesh/peer-auth.ts): loopback/RFC1918/
    tailnet-CGNAT/*.ts.net origins are answered with CORS headers, anything
    else gets 403. /exec and /agent-turns are the one exception - loopback
    tools only, refused outright when a request carries an Origin header at
    all (a same-origin fetch never sends one).

    HTTP endpoints (loopback + trusted-origin browsers):
      GET  /health, /transports, /sessions, /index
      GET  /runtimes?transport=<name>           - {id, label, bin, available,
                                                  path, resumable, attachable,
                                                  checkedAt} per claude/codex/
                                                  cursor/gemini, one login-
                                                  shell probe, cached 5 min
      GET  /index                               - {node, shellOrigin:
                                                  {loopback, public}, updatedAt,
                                                  rows}. Same body this node
                                                  publishes to the state
                                                  service's shells.sessions /
                                                  node:<name> config doc. Row:
                                                  {id, runtime, kind: shell|
                                                  cli|desktop|bg, cwd, project,
                                                  title, status: working|idle|
                                                  ended|unknown, statusSource:
                                                  hooks|pane|transcript|
                                                  registry|none, startedAt,
                                                  lastActivityAt, resumable,
                                                  attachable, resumeRef,
                                                  resumeCommand, shell?
                                                  {transport, tmuxSession,
                                                  label, sessionId}, threadId?,
                                                  claimedBy? {kind: thread|
                                                  card, id}, transcript?
                                                  {format, path}}
      GET  /tunnels                             - per-tunnel health. Reports
                                                  `carrying` (the forward
                                                  answered as ssh), never a
                                                  bare `alive`; process-table
                                                  liveness survives nested
                                                  under `child`, because it is
                                                  what once said "healthy"
                                                  through a total outage
      POST /tunnels/:transport-or-tunnel/repair - force reap + retire + redial
                                                  now, bypassing hysteresis and
                                                  backoff (but not the
                                                  one-repair-at-a-time lock)
      POST /sessions {transport, label?,
        runtime?, resume?, attach?}             - start/attach (idempotent per
                                                  transport+tmux session).
                                                  `runtime` picks the catalog
                                                  (new/resume/attach argv);
                                                  omitted, the transport's own
                                                  standing agentCommand types
                                                  as before
      POST /sessions/:id/input {text}           - type a line + Enter
      POST /sessions/:id/keys {keys}            - named key (Escape, C-c, ...)
      POST /sessions/:id/turn {text}            - start a tracked turn
      GET  /sessions/:id/turns/:turnId?waitMs=N&sinceRev=R
                                                - long-poll settlement; returns
                                                  early with {output, outputRev}
                                                  whenever the remote pane has
                                                  printed something past R
      GET  /sessions/:id/screen?lines=N         - ANSI-free pane capture
      POST /sessions/:id/detach                 - drop the local attach client
      DELETE /sessions/:id                      - forget locally (remote tmux
                                                  is NEVER killed)
      WS   /io                                  - dev-env terminal protocol
                                                  (init/init_ack/resize/bytes)

    Log footprint on the remote, so nobody debugs it a month from now: the
    health probe opens one TCP connection per `tunnel_check_seconds` per
    devtunnel-backed transport and writes an SSH-2.0-Garrison-Probe
    identification string before disconnecting — so the remote's sshd logs an
    ordinary protocol disconnect rather than the port-scanner line ("Did not
    receive identification string"). Most of those connections never happen:
    a transport that carried real ssh traffic inside the last tick is skipped.

    Setup on the REMOTE machine is one script:
    scripts/remote-shell/csg-bootstrap.sh in the Garrison repo (loopback sshd,
    tmux session, agent start/stop hooks appending to ~/.garrison/events.jsonl
    there). The remote opens no connection to Garrison, ever: the events file
    is followed over the same inbound ssh transport.

    Setup on THIS machine (the local transport) is scripts/install-hooks.mjs,
    run at fitting start: it merges (never replaces) the same lifecycle hook
    into Cursor's hooks.json (stop/beforeSubmitPrompt), Codex's hooks.json
    (UserPromptSubmit/Stop/SessionStart/SessionEnd), and Gemini's
    settings.json (BeforeAgent/AfterAgent/SessionStart/SessionEnd), matched
    idempotently by exact command string; every unrelated entry in each file
    is left untouched, and each file is snapshotted once under
    ~/.garrison/snapshots/shells-<name>.before.json before its first edit.
    scripts/uninstall-hooks.mjs removes only what this fitting added. Codex
    trusts a new hook interactively on its NEXT launch after install (this
    writer never touches ~/.codex/config.toml's [hooks.state] trust hashes -
    the hash algorithm is Codex's own and not reproducible here). Claude
    Code's own hooks are never touched by this fitting; its status comes
    straight from the live registry (~/.claude/sessions/<pid>.json), which
    needs no hook at all.
