# Dedicated tmux config for the remote-shell-runtime fitting's LOCAL transport.
# Loaded via `tmux -S <this fitting's own socket> -f <this file>` so it never
# touches the user's default tmux server, dev-env's own socket
# ($GARRISON_HOME/tmux/dev-env.sock), or ~/.tmux.conf. Sessions.mjs pins the
# window size explicitly per session (`window-size manual`), so this file does
# not set one.

# No status bar - the pane fills the whole xterm pane in the browser.
set -g  status off

# Scrollback authority: the attach client is always in the alternate screen
# under tmux, so history lives here, not in the outer xterm.
set -g  history-limit 50000

# No Escape-key debounce - claude/vim send raw Esc constantly.
set -sg escape-time 0

set -g  default-terminal "xterm-256color"

# A locale-less launch environment (systemd/launchd) renders CLI glyphs as
# ASCII "_"; export a UTF-8 locale into every new pane.
set-environment -g LANG en_US.UTF-8
set-environment -g LC_CTYPE en_US.UTF-8

# Wheel scrolls the pane's history - session-scoped (`mouse on` per session in
# sessions.mjs `start()`), not globally.

# Sessions must outlive their attach client - that is the whole point.
set -g  destroy-unattached off
