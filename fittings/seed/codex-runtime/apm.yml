name: codex-runtime
version: 0.1.0
description: Codex runtime (Runtime Faculty) — a secondary runtime that proves coding delegation. Drives `codex exec` (non-interactive, prompt via stdin) behind the uniform RuntimeAdapter + runtime-bridge delegate() contract.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: runtimes
  category: Operations
  # RUNTIME-ACCOUNTS-V1 D6 (best-effort, untested): Codex's native login. The
  # config UI runs this in a guided PTY; credentials land in Codex's own store.
  login:
    command: codex login
    storage_hint: "~/.codex/auth.json (ChatGPT OAuth; one account at a time)"
  cardinality_hint: multi
  component_shape: cli-skill
  ui:
    views:
      - id: runtime
        placement: sidebar-surface
        entry: garrison:runtime
        route: /
  platforms:
    - all
  summary: >-
    A secondary Runtime fitting. Implements the RuntimeAdapter contract over
    `codex exec` (clean non-PTY channel — prompt via stdin, never argv) and ships
    a runtime-bridge exposing the uniform delegate(task_spec) -> {summary,
    artifacts} tool. The orchestrator routes `secondary:codex` tasks here; the
    primary calls the bridge, Codex does the work in its own loop, and returns a
    self-contained result + artifact paths.
  config_schema:
    - key: model
      type: string
      default: gpt-5-codex
      description: Default Codex model for delegated tasks (validated against the per-provider allowlist).
    - key: account
      type: string
      default: ""
      description: Which OpenAI identity Codex runs under - Machine login (this box's own ~/.codex login) or a pinned account, whether Codex is primary or a delegate target. A ChatGPT-subscription account runs Codex in its own CODEX_HOME; an API-key account is injected as OPENAI_API_KEY. Manage accounts on the Accounts page.
  provides:
    - kind: runtime
      name: codex
  consumes: []
  # D3 (GARRISON-RUNTIMES-V1): provider overrides for the Codex engine apply
  # through its native config file, not env — the model_providers table plus
  # the top-level model key in ~/.codex/config.toml.
  provider_mechanism:
    type: config-file
    config_file: ~/.codex/config.toml
    config_format: toml
    config_key: model_providers
    model_key: model
  # D5/P6: the generic Quarters tier renders the Codex engine's native config
  # surfaces from this descriptor — honest labels for what each file IS, as
  # verified against the real installed CLI (FINDING-E6): config.toml is the
  # settings + MCP surface (mcp_servers tables), AGENTS.md is the context-file
  # convention, ~/.codex/log + sessions hold the tailable output.
  quarters_descriptor:
    tier: generic
    id: codex
    home_dir: ~/.codex
    settings_files:
      - path: ~/.codex/config.toml
        format: toml
        label: config.toml — model, personality, projects trust, MCP servers
    context_file: AGENTS.md
    mcp_config:
      path: ~/.codex/config.toml
      format: toml
      key: mcp_servers
    log_paths:
      - ~/.codex/log
      - ~/.codex/sessions
    categories:
      - settings
      - context
      - mcps
      - logs
  setup:
    # Provision the isolated CODEX_HOME the launcher points `codex exec` at
    # ($GARRISON_HOME/runtime-homes/codex): create the dir (the Codex CLI errors
    # "Error finding codex home" without it) and SYMLINK the box's auth.json into
    # it. The link is not a style choice - a ChatGPT credential holds a rotating
    # refresh token, so a copy makes two homes race and OpenAI revokes both. See
    # the script's header. Idempotent, and it repairs a home already holding a
    # duplicate copy.
    command: node scripts/provision-home.mjs
    idempotent: true
    timeout_ms: 10000
  verify:
    command: node apm_modules/_local/codex-runtime/scripts/bridge.mjs --probe
    expect: ok
    timeout_ms: 20000
  for_consumers: |
    Codex-as-secondary. When the orchestrator resolves a task to
    `secondary:codex`, the primary calls this fitting's runtime-bridge tool:
      delegate(task_spec) -> {summary, artifacts}
    The task spec (JSON: task, paths, constraints, model, expectedSchema) is
    passed via STDIN (never argv). `model` is validated against the per-provider
    allowlist; a missing model / API key fails loudly (locked vs absent). Full
    output lands in the Artifact Store; the return is a schema-validated summary
    + artifact paths; every delegation is appended to decisions.jsonl.
    CLI:  echo '<task_spec_json>' | node scripts/bridge.mjs delegate
    Probe: node scripts/bridge.mjs --probe   → prints "ok"

    When to delegate. Delegate only when ALL THREE hold: the work is
    token-heavy (a wide read, a long trace, a repo-scale sweep you would
    otherwise pay for in your own context); it is fully specifiable in one
    paragraph, because the secondary sees your brief and nothing else — no
    conversation, no prior turns, no shared files you did not name; and the
    result is cheaply verifiable, because you cannot watch the work happen.
    Fails any one of those and doing it yourself is cheaper than repairing a
    plausible wrong answer.

    Pin the output shape in the brief — an `expectedSchema`, or one explicit
    sentence naming the fields you want back. An unpinned brief returns prose
    you then have to parse and re-ask about, which costs more than the
    delegation saved.

    What comes back is a SUMMARY plus artifact references, not a verdict.
    Return evidence pointers — the file, the line, the command output that
    shows it — so the claim can be checked against something. A bare
    "looks fine" / "found 3 issues" is not a result; it is a claim with the
    evidence stripped off.

    Context telemetry and compaction (degradation). Codex runs stateless — one
    `codex exec` per turn with the prompt on stdin — so no context accumulates across
    turns and compaction is structurally moot (there is no long-lived session to
    compact). Token usage IS reported: the adapter runs `codex exec --json` and reads
    the closing `turn.completed` event, so a delegated Codex turn reports
    `usedTokens` (input + output). Context % and peak context stay unavailable —
    there is no persistent session to measure them against — and compactions are
    always zero.
