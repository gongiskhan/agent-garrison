name: capture-service
version: 0.1.0
description: iOS companion capture channel — session-based websocket ingress (audio + screen stills), Deepgram live transcription, wake-word command pipe over live segments, capture_events into the shared triage inbox, APNs push out, and the spoken-acknowledgement sink.
target: claude
type: hybrid
includes: auto
x-garrison:
  faculty: channels
  category: Interfaces
  cardinality_hint: multi
  component_shape: script
  own_port: true
  default_port: 8097
  platforms:
    - claude-code
  summary: Makes the Garrison iOS companion app (deliberate, session-based capture — meetings, dictation, car sessions) one of Garrison's ears and its primary mouth, while Garrison remains the only brain. Every pipe behind its own default-off flag.
  for_consumers: |
    Channel id "companion" — the Garrison iOS companion app. Inbound sessions
    are transcribed and triaged into Kanban cards and memories by the shared
    heartbeat, NOT by you; treat session transcripts as input evidence only and
    never surface them as your own output. Wake-word commands spoken during a
    live session arrive as regular turns on channel "companion". Short
    confirmations are spoken on the user's phone or delivered as push
    notifications; message text is always generated on our side. Do not write
    tasks anywhere but the Kanban Loop — it is the single home for tasks.
  config_schema:
    - key: port
      type: integer
      default: 8097
      description: Local port the capture service binds to (base family; per-instance offset applied by the runner).
    - key: bind_host
      type: string
      default: 127.0.0.1
      description: Bind host for the server. Loopback by default; the phone reaches it over the tailnet serve mapping, never a wide bind.
    - key: enabled
      type: boolean
      default: false
      description: Master switch for capture ingress (session websocket + device registration). Off = every ingress surface answers 403 and nothing is stored.
    - key: transcribe_enabled
      type: boolean
      default: false
      description: Deepgram live transcription of session audio. STT is billed only while a session is live; off = sessions store media without transcripts.
    - key: wake_enabled
      type: boolean
      default: false
      description: Wake-word bus over live transcript segments. Non-matching segments are dropped in memory and never persisted or logged with content.
    - key: notify_enabled
      type: boolean
      default: false
      description: Outbound APNs push notifications (card-created notices, wake confirmations, asks, tips). Off or failing degrades to the web-channel thread.
    - key: speak_enabled
      type: boolean
      default: false
      description: The voice-out sink — forwards acknowledgements to a live session socket for on-device speech. Off = acks fall through to push only.
    - key: stt_model
      type: string
      default: nova-3
      description: Deepgram live model. Verified against current docs at build time (M2); language handling in stt_language.
    - key: stt_language
      type: string
      default: pt
      description: >-
        Deepgram language parameter. Pinned to "pt" - replaying real captures
        proved "multi" misdetects the language from a short quiet wake-word
        head and renders PT audio as German/Italian garbage; pinned pt with
        stt_keyterms handles the operator's embedded English fine.
    - key: stt_keyterms
      type: string
      default: Zeca,companion
      description: >-
        Comma-separated Deepgram keyterm prompts (nova-3). Lifts wake-word
        confidence to ~1.0 and rescues embedded English product words.
    - key: classify_target
      type: string
      default: cc-haiku-low
      description: >-
        Routing target every classification call is pinned to (wake intent).
        Unpinned these land on the composition's other/L1 duty cell - a full
        full turn carrying the whole toolset, measured at 82s for one
        classification, while the speaker waits. Empty = no pin.
    - key: delegate_enabled
      type: boolean
      default: true
      description: >-
        Allow a spoken command to be handed to the full session (its tools and
        connected services) when the fast lane cannot do it. The answer arrives
        as a follow-up notification. Off = spoken requests are limited to cards
        and notes.
    - key: delegate_timeout_ms
      type: integer
      default: 600000
      description: Wall-clock budget for one delegated session turn. Nobody is blocked on this; it is a work budget, not a response budget.
    - key: wake_variants
      type: string
      default: 'zeca,zeka,zecca,zéca,ze ca'
      description: Comma-separated spellings of the agent's name (Zeca), matched case-insensitively on word boundaries in address position; a space inside a spelling also matches a hyphen. Portuguese and English transcripts both occur.
    - key: wake_silence_close_ms
      type: integer
      default: 4000
      description: Close a wake capture after this much silence (no new segment) and dispatch the assembled command.
    - key: wake_settled_close_ms
      type: integer
      default: 5000
      description: >-
        Shorter capture close used only when the last segment ends a sentence
        ('.', '?' or '!'). 0 = always wait the full window. Ignored unless
        shorter than it.
    - key: wake_max_capture_ms
      type: integer
      default: 20000
      description: Hard cap on a single wake capture window.
    - key: wake_min_capture_ms
      type: integer
      default: 0
      description: Hold the capture window open at least this long after a wake hit, through silence. 0 = close on silence.
    - key: wake_command_window_ms
      type: integer
      default: 60000
      description: How much post-wake speech counts as THE COMMAND; later speech is trailing context for the classifier.
    - key: tts_enabled
      type: boolean
      default: false
      description: >-
        Speak Zeca's acknowledgements in an ElevenLabs voice instead of the
        phone's built-in synthesizer. Off, or with no ELEVENLABS_API_KEY, the
        phone speaks in its own voice and nothing else changes.
    - key: tts_voice_id
      type: string
      default: RlGHmE2fztwdBDat0jYf
      description: >-
        ElevenLabs voice. Default is Diogo, a native European Portuguese
        library voice - native pt voices hold the accent that premade voices
        lose on the short lines Zeca speaks.
    - key: tts_model
      type: string
      default: eleven_multilingual_v2
      description: >-
        Keep multilingual_v2 unless you know why. eleven_v3 rejects the
        previous_text/next_text anchors that stop short Portuguese clips
        drifting into Brazilian.
    - key: tts_cache_max_clips
      type: integer
      default: 500
      description: Cached spoken clips kept on disk, oldest evicted first. 0 disables pruning.
    - key: cue_enabled
      type: boolean
      default: false
      description: >-
        Speak a short cue the moment the wake word lands ("Sim?"/"Yes?") and
        again when the capture window closes ("Ok."/"Okay."). Without it the
        wearer hears nothing until the card exists, roughly 25 seconds later,
        and cannot tell "heard you" from "did not hear you".
    - key: voice_language
      type: string
      default: auto
      description: >-
        Language Zeca speaks: pt, en, or auto. Auto follows whatever the user
        last said to Zeca, so the cue answers "Sim?" or "Yes?" to match.
    - key: language_memory_ttl_ms
      type: integer
      default: 21600000
      description: >-
        How long the last spoken language stays authoritative. Long on purpose -
        this is stickiness across a day, not a per-utterance flip.
    - key: wake_language
      type: string
      default: auto
      description: >-
        Language for the wake path's own confirmations (card created, snoozed,
        note saved). Auto reads it from what was actually said.
    - key: discuss_enabled
      type: boolean
      default: false
      description: >-
        Spoken discussions. "Zeca, quero discutir X" opens a conversation that
        continues without the wake word until you end it. Costs one duty-class
        turn per utterance, so it is opt-in and bounded.
    - key: discuss_level
      type: integer
      default: 1
      description: Duty level for a spoken discussion turn. Level 2+ expects research and costs more.
    - key: discuss_idle_ms
      type: integer
      default: 180000
      description: Silence after which a spoken discussion closes itself.
    - key: discuss_turn_timeout_ms
      type: integer
      default: 90000
      description: Past this a discussion turn is abandoned and said so, rather than hanging.
    - key: discuss_max_turns
      type: integer
      default: 40
      description: Hard ceiling on one discussion, so a stuck conversation cannot bill forever.
    - key: send_enabled
      type: boolean
      default: false
      description: >-
        Spoken sends ("manda uma mensagem à Marília"). The recipient is resolved
        against the real contact list and never guessed; the send is parked and
        announced out loud before it goes.
    - key: send_default_medium
      type: string
      default: whatsapp
      description: >-
        Where an unspoken medium goes. Never email - email is the one send with
        no daemon and no cancel window of its own.
    - key: confirm_enabled
      type: boolean
      default: false
      description: >-
        Announce a parked send out loud, with recipient and text, and let the
        wearer stop it by saying "cancela" - no wake word, since they are
        answering a prompt.
    - key: confirm_poll_ms
      type: integer
      default: 1000
      description: How often the parked-send outbox is polled while a confirmation watch is armed.
    - key: confirm_watch_ms
      type: integer
      default: 90000
      description: How long the confirmation watch stays armed after an action.
    - key: confirm_arm_delay_ms
      type: integer
      default: 1500
      description: >-
        Fallback delay before the cancel window opens when no spoken receipt
        arrives. The announcement itself contains the word "cancela", so the
        window must not open before it has finished being spoken.
    - key: cancel_variants
      type: string
      default: cancela,cancelar,cancel,stop,esquece
      description: >-
        Words that stop a parked send. Bare "não"/"no" are deliberately absent -
        far too common in speech, and a false cancel is cheaper than a false send.
    - key: automate_enabled
      type: boolean
      default: false
      description: Run a named Cortex automation by voice, with an idempotency key.
    - key: cortex_catalog_ttl_ms
      type: integer
      default: 300000
      description: How long the Cortex automation catalog is cached for name resolution.
    - key: cortex_poll_interval_ms
      type: integer
      default: 15000
      description: Background poll interval for a started automation run.
    - key: cortex_poll_max_ms
      type: integer
      default: 600000
      description: Give up polling a run after this and say so.
    - key: screen_context_enabled
      type: boolean
      default: false
      description: >-
        Let a spoken command use the phone screen being broadcast ("responde-lhe
        que é melhor amanhã"). The newest frame is handed to the operative as a
        file path; a command that needs the screen and has none is refused out
        loud rather than acted on blind.
    - key: screen_context_max_age_ms
      type: integer
      default: 30000
      description: >-
        How old the newest frame may be, measured from the moment the user spoke
        rather than from dispatch.
    - key: wake_followup_window_ms
      type: integer
      default: 12000
      description: >-
        After Zeca speaks a clarifying question, how long the next utterance -
        no wake word needed - counts as the answer. Opens only once the phone
        confirms the question was actually spoken.
    - key: wake_followup_max_rounds
      type: integer
      default: 3
      description: >-
        Ceiling on clarifying-question rounds per exchange. A model that keeps
        asking stops being answered.
    - key: screen_audio_transcribe
      type: boolean
      default: true
      description: >-
        Whether a screen-sharing session also transcribes. Set FALSE when the
        pendant is worn alongside: otherwise one spoken sentence reaches two
        microphones, hits two wake buses, and dispatches twice.
    - key: transcribe_mute_timeout_ms
      type: integer
      default: 120000
      description: >-
        Reconnect the speech-to-text socket when audio is still being fed but
        nothing at all has come back for this long - the far end accepting
        audio and silently no longer processing it. 0 disables the watchdog.
    - key: wake_provisional_ttl_ms
      type: integer
      default: 8000
      description: >-
        How long a wake pulse fired off an unstable Deepgram interim waits for
        the authoritative final to confirm it. Sized to one utterance, not to
        the capture window. On expiry the wearer gets a wake_lapsed signal, so a
        pulse that promised a capture cannot silently promise nothing.
    - key: wake_context_segments
      type: integer
      default: 6
      description: Pre-wake segments handed to the classifier as context on a hit (bounded by count and age). 0 disables.
    - key: wake_context_max_age_ms
      type: integer
      default: 120000
      description: Maximum age of pre-wake context segments.
    - key: wake_card_dedupe_ms
      type: integer
      default: 600000
      description: Suppress a second card whose resolved title matches one just created within this window. 0 disables.
    - key: notify_max_per_day
      type: integer
      default: 50
      description: Per-day cap on ROUTINE outbound APNs pushes (error acks); beyond it delivery degrades to the web-channel thread. Interactive pushes have their own budget.
    - key: notify_interactive_max_per_day
      type: integer
      default: 200
      description: Per-day cap on INTERACTIVE pushes - wake confirmations, asks, card links answering the user's own spoken commands. Separate from the routine budget so fan-out chatter can never starve feedback.
    - key: apns_environment
      type: string
      default: production
      description: APNs endpoint — "production" (TestFlight and App Store builds use the production gateway) or "sandbox" (Xcode development builds).
    - key: apns_topic
      type: string
      default: com.gomes.garrison
      description: The app bundle id, sent as apns-topic on every push.
    - key: session_idle_timeout_ms
      type: integer
      default: 300000
      description: A live session with no frames for this long is closed with reason "timeout".
    - key: min_transcript_words
      type: integer
      default: 12
      description: Triage hold floor — a session ending with fewer transcript words than this is held as a thin fragment rather than carded alone (wait-for-context).
    - key: pendant_enabled
      type: boolean
      default: false
      description: Pendant Direct path — accept mode "pendant" sessions (the Companion relaying the BLE pendant's audio). Independent kill switch; off refuses pendant session_start while every companion mode keeps working.
    - key: capture_policy
      type: string
      default: wake_only
      description: Pendant sessions only — "wake_only" (default) persists nothing but the wake path (no media log, no transcript, no capture_event; counters only), "ambient" persists pendant session transcripts and feeds them into the shared triage tick. Mic sessions are unaffected either way.
  secret_scope:
    - DEEPGRAM_API_KEY
    - ELEVENLABS_API_KEY
    - CAPTURE_TOKEN
    - APNS_TEAM_ID
    - APNS_KEY_ID
    - APNS_P8
  provides:
    - kind: channel
      name: companion
  consumes:
    - kind: vault
      cardinality: one
    - kind: memory-store
      cardinality: optional-one
  setup:
    command: bash scripts/setup.sh
    idempotent: true
    timeout_ms: 15000
  verify:
    command: node apm_modules/_local/capture-service/scripts/capture.mjs --probe
    expect: CAPTURE-OK
    timeout_ms: 10000
