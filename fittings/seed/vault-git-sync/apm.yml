name: vault-git-sync
version: 0.1.0
description: Commit + push the Basic Memory Obsidian vault to git on a schedule, so memory written by any agent (even with no editor open) syncs across machines.
target: claude
type: skill
includes: auto
x-garrison:
  faculty: sessions
  category: Interfaces
  cardinality_hint: single
  component_shape: cli-skill
  ui:
    views:
      - id: manage
        placement: sidebar-surface
        entry: garrison:manage
        route: /
  platforms:
    - claude-code
  summary: >-
    A scheduler-driven git sync for the Obsidian vault — the SINGLE driver of
    memory movement on every mesh node. On each fire it runs the Claude memory
    mirror where present (fail-closed), commits local agent/editor writes,
    rebases in other machines' commits (--autostash, aborts on conflict — never
    hard-resets), and pushes. Pure shell ($0, no model). setup.sh registers TWO
    jobs: the 15-minute sync (`cron` config) and a nightly --require-fresh
    backstop staggered per node. The git logic lives IN-TREE at
    scripts/obsidian-vault-sync.sh; the old ~/.claude/tools copy and the
    standalone systemd/launchd timers are retired. Status:
    ~/.garrison/obsidian-vault-sync-status.json (distinct from the retired
    rsync vault-sync fitting's status file).
  for_consumers: |
    Don't drive vault-git-sync yourself — it runs on the scheduler.
    Force an immediate sync: `node apm_modules/_local/scheduler/scripts/scheduler.mjs run-now vault-git-sync`.
    Last-sync state: ~/.garrison/obsidian-vault-sync-status.json; full log:
    ~/Library/Logs/obsidian-vault-sync.log. Change cadence via the `cron` config
    and re-run `up` (setup re-registers the job idempotently).
  config_schema:
    - key: cron
      type: string
      default: "*/15 * * * *"
      description: Sync schedule (5-field cron). Default every 15 minutes on every mesh node; a nightly --require-fresh backstop is registered alongside with a per-node staggered minute. Registered via the scheduler CLI in setup.sh.
    - key: vault_dir
      type: path
      default: ~/ObsidianVault
      description: The Obsidian vault git repo to commit + push. Passed to the sync script as OBSIDIAN_VAULT.
  provides: []
  consumes:
    - kind: automation-runner
      name: scheduler
      cardinality: one
  setup:
    command: bash scripts/setup.sh
    idempotent: true
    timeout_ms: 10000
  verify:
    command: bash apm_modules/_local/vault-git-sync/scripts/verify.sh
    expect: ok
    timeout_ms: 10000
